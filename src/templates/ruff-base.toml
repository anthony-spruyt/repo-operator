line-length = 120

[lint]
select = [
    "A",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "E",
    "F",
    "FURB",
    "I",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PLE",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLW",
    "PT",
    "RET",
    "RUF",
    "SIM",
    "UP",
    "W",
]

[lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
