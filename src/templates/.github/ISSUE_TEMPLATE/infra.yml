name: Infrastructure
description: Infrastructure changes (Talos, Terraform, networking, storage)
title: "chore(scope): "
labels: ["infra"]
body:
  - type: markdown
    attributes:
      value: Leave out secrets, IPs, CIDRs, hostnames and domains.

  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem or goal.
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What
      description: The change, which nodes or components it touches, and the steps.
    validations:
      required: true

  - type: textarea
    id: rollback
    attributes:
      label: Rollback
      description: How to undo it.
    validations:
      required: true

  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: How we will check it worked.
    validations:
      required: false
