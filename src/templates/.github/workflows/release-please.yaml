---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: "Release Please"

on:
  push:
    branches:
      - "main"
  workflow_dispatch: {}

concurrency:
  group: "release-please-${{ github.ref }}"
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    permissions:
      contents: "read"
    uses: "anthony-spruyt/repo-operator/.github/workflows/_release-please.yaml@8358ffc12a6b1175ea15aecc37543bfbfa34e3e9" # main
    secrets:
      RELEASE_PLEASE_APP_CLIENT_ID: "${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}"
      RELEASE_PLEASE_APP_PRIVATE_KEY: "${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}"
