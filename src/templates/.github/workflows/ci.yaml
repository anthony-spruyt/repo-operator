---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
# See https://github.com/anthony-spruyt/repo-operator/blob/main/src/templates/.github/workflows/ci.yaml for template comments
name: "CI"

on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"

permissions: {}

jobs:
  lint:
    permissions:
      actions: "read"
      contents: "read"
      security-events: "write"
    uses: "anthony-spruyt/repo-operator/.github/workflows/_lint.yaml@b5ea71d349323dc58c83a432fff57f2d2bf1b39f" # main

  # Repo-only jobs go in ci-repo.yaml, which the repo owns; xfg seeds it once
  repo:
    needs:
      - "lint"
    permissions:
      contents: "read"
    uses: "./.github/workflows/ci-repo.yaml"
    secrets: "inherit"

  # Builds the release-please packages with a Dockerfile whose files changed; a repo without one builds nothing
  image:
    needs:
      - "lint"
      - "repo"
    # A skipped repo (the seed has no live job) would otherwise skip this job too
    if: "!cancelled() && needs.lint.result == 'success' && (needs.repo.result == 'success' || needs.repo.result == 'skipped')"
    permissions:
      contents: "read"
    uses: "anthony-spruyt/repo-operator/.github/workflows/_images.yaml@6ac30f4a40fc9e09569d7e39b993c6a6414547a0" # main

  # The one required check: it judges every job in the run, the repo / ... jobs included
  summary:
    needs:
      - "lint"
      - "repo"
      - "image"
    if: "always()"
    permissions:
      actions: "read"
      contents: "read"
    uses: "anthony-spruyt/repo-operator/.github/workflows/_summary.yaml@b5ea71d349323dc58c83a432fff57f2d2bf1b39f" # main
