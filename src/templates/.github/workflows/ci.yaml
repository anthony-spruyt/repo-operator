---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
# See https://github.com/anthony-spruyt/repo-operator/blob/main/src/templates/.github/workflows/ci.yaml for template comments
name: "CI"

on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"

permissions: {}

# Labeled, push and dispatch runs get their own group so they never cancel or get cancelled
concurrency:
  group: "${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.pull_request.number || github.run_id }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}"

jobs:
  lint:
    permissions:
      actions: "read"
      contents: "read"
      security-events: "write"
    uses: "anthony-spruyt/repo-operator/.github/workflows/_lint.yaml@55f5772eda61e5585fcfe7207d409f86ab130c5b" # main

  # Repo-only jobs go in ci-repo.yaml, which the repo owns; xfg seeds it once
  repo:
    needs:
      - "lint"
    permissions:
      contents: "read"
    uses: "./.github/workflows/ci-repo.yaml"
    secrets: "inherit"

  # Builds the release-please packages with a Dockerfile or flavor.yaml whose files changed; a repo without one builds nothing
  image:
    needs:
      - "lint"
      - "repo"
    # A skipped repo (the seed has no live job) would otherwise skip this job too
    if: "!cancelled() && needs.lint.result == 'success' && (needs.repo.result == 'success' || needs.repo.result == 'skipped')"
    permissions:
      contents: "read"
    uses: "anthony-spruyt/repo-operator/.github/workflows/_images.yaml@55f5772eda61e5585fcfe7207d409f86ab130c5b" # main

  # The one required check from CI: it judges every job in the run, the repo / ... jobs included
  summary:
    needs:
      - "lint"
      - "repo"
      - "image"
    if: "always()"
    permissions:
      actions: "read"
      contents: "read"
    uses: "anthony-spruyt/repo-operator/.github/workflows/_summary.yaml@55f5772eda61e5585fcfe7207d409f86ab130c5b" # main
