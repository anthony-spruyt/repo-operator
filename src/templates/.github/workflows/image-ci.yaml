---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: "CI"

on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"

permissions:
  contents: "read"

jobs:
  lint:
    permissions:
      actions: "read"
      contents: "read"
      security-events: "write"
    uses: "anthony-spruyt/repo-operator/.github/workflows/_lint.yaml@b5ea71d349323dc58c83a432fff57f2d2bf1b39f" # main

  image:
    uses: "anthony-spruyt/repo-operator/.github/workflows/_build-image.yaml@b5ea71d349323dc58c83a432fff57f2d2bf1b39f" # main
    with:
      language: "${xfg:language}"

  repo:
    needs:
      - "lint"
    permissions:
      contents: "read"
    uses: "./.github/workflows/ci-repo.yaml"
    secrets: "inherit"

  summary:
    needs:
      - "lint"
      - "image"
      - "repo"
    if: "always()"
    permissions:
      actions: "read"
      contents: "read"
    uses: "anthony-spruyt/repo-operator/.github/workflows/_summary.yaml@b5ea71d349323dc58c83a432fff57f2d2bf1b39f" # main
