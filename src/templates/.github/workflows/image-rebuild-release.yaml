---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: "Rebuild Release"

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image to rebuild; leave empty when the repo has one image"
        required: false
        type: "string"
        default: ""
      version:
        description: "Version to rebuild, without a leading v (e.g., 1.0.0)"
        required: true
        type: "string"

permissions:
  contents: "write"
  packages: "write"
  id-token: "write"
  attestations: "write"

jobs:
  rebuild:
    uses: "anthony-spruyt/repo-operator/.github/workflows/_rebuild-release.yaml@c2d153bb417df2c6e65602b595e2204a0704b2a5" # main
    with:
      version: "${{ inputs.version }}"
      language: "${xfg:language}"
