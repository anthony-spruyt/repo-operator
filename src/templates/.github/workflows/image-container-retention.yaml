---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: "Container Retention"

on:
  schedule:
    - cron: "0 17 * * 6" # Weekly, Saturdays 17:00 UTC (Sunday morning Melbourne); deletes for real
  workflow_dispatch:
    inputs:
      dry-run:
        description: "List what would be deleted without deleting it"
        type: "boolean"
        default: true

permissions: {}

jobs:
  cleanup:
    permissions:
      packages: "write"
    uses: "anthony-spruyt/repo-operator/.github/workflows/_container-retention.yaml@2bb0362170266430d2277de0dde5a204ecbf0eee" # main
    with:
      packages: "${xfg:retentionPackages}"
      # Scheduled runs get no inputs, so only a dispatch can dry-run
      dry-run: "${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}"
