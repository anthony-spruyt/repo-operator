---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: "Release Please"

on:
  push:
    branches:
      - "main"
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: "release-please-${{ github.ref }}"
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    if: "github.ref_type == 'branch'"
    permissions:
      contents: "read"
    uses: "anthony-spruyt/repo-operator/.github/workflows/_release-please.yaml@3c2a4e3846e7b5585ff44599383ccc31caddaa7e" # main
    secrets:
      RELEASE_PLEASE_APP_CLIENT_ID: "${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}"
      RELEASE_PLEASE_APP_PRIVATE_KEY: "${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}"
  recover:
    needs: "release"
    if: "!cancelled()"
    permissions:
      contents: "read"
      actions: "write"
    uses: "anthony-spruyt/repo-operator/.github/workflows/_release-recover.yaml@3c2a4e3846e7b5585ff44599383ccc31caddaa7e" # main
    with:
      releases: "${{ needs.release.outputs.releases }}"
    secrets:
      RELEASE_PLEASE_APP_CLIENT_ID: "${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}"
      RELEASE_PLEASE_APP_PRIVATE_KEY: "${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}"
  images:
    needs: ["release", "recover"]
    if: "!cancelled() && (needs.release.outputs.release-created == 'true' || needs.recover.outputs.release-created == 'true')"
    permissions:
      contents: "write"
      packages: "write"
      id-token: "write"
      attestations: "write"
    uses: "anthony-spruyt/repo-operator/.github/workflows/_release-images.yaml@3c2a4e3846e7b5585ff44599383ccc31caddaa7e" # main
    with:
      releases: "${{ needs.recover.outputs.releases || needs.release.outputs.releases }}"
      language: "${xfg:language}"
      dockerhub-namespace: "aspruyt"
    secrets:
      DOCKERHUB_TOKEN: "${{ secrets.DOCKERHUB_TOKEN }}"
