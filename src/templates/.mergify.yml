merge_queue:
  # Batches can fail on a flaky mid-batch state; trust the later batch that
  # contains the same PR rather than dequeuing it.
  skip_intermediate_results: true

queue_rules:
  # merge_protections decide who may merge; auto_merge_conditions queue the PR
  # once they pass. Mergify injects the ruleset check as success OR neutral OR
  # skipped, so the explicit check-success line is what demands a real pass.
  - name: default
    merge_method: squash
    batch_size:
      min: 1
      max: 10
    batch_max_wait_time: 5 min
    max_checks_retries: 3
    merge_conditions:
      - -draft
      - "check-success = summary / Check Results"

pull_request_rules:
  - name: cleanup labels on close
    conditions:
      - closed
      - -merged
    actions:
      label:
        remove:
          - agent/triage
          - agent/fixing
          - agent/fixable
          - agent/needs-review
  - name: release
    conditions:
      - base = main
      - "label=autorelease: pending"
      - author = repo-operator-release-bot[bot]
      - "head~=^release-please--branches--"
      - "files~=^\\.release-please-manifest\\.json$"
      - "-commits[*].author~=^(?!repo-operator-release-bot\\[bot\\]$)"
      - "-commits[*].email_author~=^(?!321986956\\+repo-operator-release-bot\\[bot\\]@users\\.noreply\\.github\\.com$)"
      - "-commits[*].email_committer~=^(?!noreply@github\\.com$)"
      - "#commits-unverified = 0"
      - schedule = Mon-Mon 09:00-12:00[Australia/Melbourne]
    actions:
      review:
        type: APPROVE

merge_protections:
  - name: approval
    if:
      - base = main
    success_conditions:
      - "#approved-reviews-by >= 1"

  - name: outsider
    if:
      - base = main
      - -author = anthony-spruyt
      - -author = spruyt-labs-bot
      - -author = skynet-rw[bot]
      - -author = skynet-r[bot]
      - -author = renovate[bot]
      - -author = repo-operator-release-bot[bot]
      - -author = repo-operator[bot]
    success_conditions:
      - approved-reviews-by = anthony-spruyt

  - name: gate-files
    if:
      - base = main
      - "files~=^(${xfg:gateFilesExtra}\\.github/|\\.mergify\\.yml$|renovate\\.json$|renovate-overrides\\.json5$)"
    success_conditions:
      - or:
          - approved-reviews-by = anthony-spruyt
          - and:
              - author = renovate[bot]
              - "-commits[*].author~=^(?!renovate\\[bot\\]$)"
              - "-commits[*].email_author~=^(?!29139614\\+renovate\\[bot\\]@users\\.noreply\\.github\\.com$)"
              - "-commits[*].email_committer~=^(?!noreply@github\\.com$)"
              - "#commits-unverified = 0"
          - and:
              - author = anthony-spruyt
              - "-commits[*].email_author~=^(?!(aspruyt@hotmail\\.co\\.uk|99536297\\+anthony-spruyt@users\\.noreply\\.github\\.com)$)"
              - "-commits[*].email_committer~=^(?!(aspruyt@hotmail\\.co\\.uk|99536297\\+anthony-spruyt@users\\.noreply\\.github\\.com|noreply@github\\.com)$)"
              - "#commits-unverified = 0"

merge_protections_settings:
  reporting_method: check-runs
  auto_merge_conditions:
    # Release PRs wait for a manual merge so Renovate bumps batch into one
    # release; the weekly window caps how long a pending fix can sit unreleased.
    - or:
        - "-label=autorelease: pending"
        - schedule = Mon-Mon 09:00-12:00[Australia/Melbourne]
    - -label = blocked
