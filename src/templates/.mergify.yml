merge_queue:
  # Batches can fail on a flaky mid-batch state; trust the later batch that
  # contains the same PR rather than dequeuing it.
  skip_intermediate_results: true

queue_rules:
  # merge_protections decide who may merge; auto_merge_conditions queue the PR
  # once they pass. Mergify injects the ruleset check as success OR neutral OR
  # skipped, so the explicit check-success line is what demands a real pass.
  - name: default
    merge_method: squash
    batch_size:
      min: 1
      max: 10
    batch_max_wait_time: 5 min
    max_checks_retries: 3
    merge_conditions:
      - -draft
      - "check-success = summary / Check Results"

priority_rules:
  - name: revert PRs
    conditions:
      - label = agent/revert
    priority: high
    allow_checks_interruption: true
  - name: emergency merge
    conditions:
      - label = emergency/merge
    priority: high
    allow_checks_interruption: true

pull_request_rules:
  - name: cleanup labels on close
    conditions:
      - closed
      - -merged
    actions:
      label:
        remove:
          - agent/triage
          - agent/fixing
          - agent/fixable
          - agent/needs-review

merge_protections:
  # This is the only approval gate for repos without GitHub branch protection.
  # Removing it lets auto_merge_conditions queue unapproved PRs.
  - name: default
    if:
      - base = main
      - -label = agent/revert
      - -label = emergency/merge
      - "-label=autorelease: pending"
      - "-head~=^chore/megalinter-refresh-"
    success_conditions:
      - "#approved-reviews-by >= 1"

  - name: megalinter-refresh
    if:
      - base = main
      - "head~=^chore/megalinter-refresh-"
    success_conditions:
      - author = repo-operator-release-bot[bot]
      - "-files~=^(?!megalinter-[^/]+/\\.rebuild-stamp$)"

  - name: release-please
    if:
      - base = main
      - "label=autorelease: pending"
    success_conditions:
      - or:
          - author = repo-operator-release-bot[bot]
          - author = xfg-release-bot[bot]
      - "head~=^release-please--branches--"
      - "files~=^\\.release-please-manifest\\.json$"

  - name: revert-approved
    if:
      - base = main
      - label = agent/revert
    success_conditions:
      - "author~=.*\\[bot\\]$"

  - name: emergency-merge
    if:
      - base = main
      - label = emergency/merge
    success_conditions:
      - author = anthony-spruyt

merge_protections_settings:
  reporting_method: check-runs
  auto_merge_conditions:
    # Release PRs wait for a manual merge so Renovate bumps batch into one
    # release; the weekly window caps how long a pending fix can sit unreleased.
    - or:
        - "-label=autorelease: pending"
        - schedule = Mon 09:00-12:00[Australia/Melbourne]
    - -label = blocked
