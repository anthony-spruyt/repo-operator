# --- Generated Secrets ---
# Must match spruyt-labs LiteLLM secret_masking.py and `task sops:gen-key`.

[[rules]]
id = "spruyt-labs-secret"
description = "Spruyt Labs generated secret (sl_ prefix)"
regex = '''(?:^|[^A-Za-z0-9_])(sl_[A-Za-z0-9]{29,})(?:[^A-Za-z0-9]|$)'''
secretGroup = 1
keywords = ["sl_"]
tags = ["secret"]
