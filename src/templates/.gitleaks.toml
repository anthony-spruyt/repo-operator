# Gitleaks configuration
# https://github.com/gitleaks/gitleaks

[extend]
# https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
useDefault = true

# --- IP/CIDR Leakage Prevention ---
# Prevents private IP addresses from being committed to public repositories.
# Per-rule pin allowlists: global targetRules allowlists are dropped on [extend]; fold back once betterleaks/betterleaks#300 is fixed.

[[rules]]
id = "private-ip-rfc1918-10"
description = "RFC1918 private IP address (10.x.x.x)"
regex = '''(?:^|[^0-9])10\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9]{1,2})\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9]{1,2})\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9]{1,2})(?:/[0-9]{1,2})?(?:[^0-9]|$)'''
tags = ["ip-leakage"]

[[rules.allowlists]]
description = "Python requirement pins that look like RFC1918 addresses"
condition = "AND"
paths = ['''(?:^|/)(?:[^/]*requirements[^/]*|constraints[^/]*)\.(?:txt|in)$''']
regexTarget = "line"
regexes = ['''^\s*[A-Za-z0-9][A-Za-z0-9._-]*(?:\[[^\]]*\])?\s*===?\s*[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(?:\s*;[^#]*?)?(?:\s+--hash=[A-Za-z0-9]+:[0-9a-fA-F]+)*\s*\\?\s*$''']

[[rules.allowlists]]
description = "Dotted versions and wheel URLs in uv.lock that look like RFC1918 addresses"
condition = "AND"
paths = ['''(?:^|/)uv\.lock$''']
regexTarget = "line"
regexes = [
  '''^\s*version = "[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(?:\+[A-Za-z0-9.]+)?"\s*$''',
  '''^\s*(?:sdist = )?\{ url = "https://(?:files\.pythonhosted\.org|download(?:-r2)?\.pytorch\.org)/[^"\s]+", hash = "sha256:[0-9a-f]{64}"(?:, size = [0-9]+)?(?:, upload-time = "[^"]*")? \},?\s*$''',
]

[[rules]]
id = "private-ip-rfc1918-172"
description = "RFC1918 private IP address (172.16-31.x.x)"
regex = '''(?:^|[^0-9])172\.(?:1[6-9]|2[0-9]|3[01])\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9]{1,2})\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9]{1,2})(?:/[0-9]{1,2})?(?:[^0-9]|$)'''
