---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/prettierrc.json
trailingComma: "es5"
tabWidth: 2
semi: true
singleQuote: false
proseWrap: "preserve"
overrides:
  - files: ["*.md", "*.json5", "*.yaml", "*.yml"]
    options:
      requirePragma: true
  - files: ["*.json"]
    options:
      parser: "json5"
      requirePragma: true
