# yaml-language-server: $schema=https://raw.githubusercontent.com/anthony-spruyt/xfg/main/config-schema.json
# Configuration for repo-operator - syncs files to target repositories
repos:
  - git: https://github.com/anthony-spruyt/agent-platform.git
    groups:
      - claude
      - agent-kit
      - mcp
      - github-ci
      - github-trivy
      - megalinter
      - megalinter-flavor
      - protected-main-branch
      - image
      - dotnet
      - mergify
      - renovate
      - sonar
    settings:
      repo:
        description: "Temporal workers and webhook intake for homelab agents, in .NET."

  - git: https://github.com/anthony-spruyt/blog.git
    groups:
      - claude
      - agent-kit
      - mcp
      - github-ci
      - github-trivy
      - megalinter
      - megalinter-flavor
      - protected-main-branch
      - image
      - mergify
      - renovate
      - sonar
    settings:
      repo:
        description: "Blog: build write-ups from the homelab."

  - git: https://github.com/anthony-spruyt/Chromance.git
    groups:
      - claude
      - agent-kit
      - mcp
      - github-ci
      - megalinter
      - megalinter-flavor
      - mergify
      - protected-main-branch
      - cpp
      - python
      - renovate
    files:
      .claude/rules/tdd.md: false
      .devcontainer/devcontainer.json:
        content:
          customizations:
            vscode:
              extensions:
                $arrayMerge: append
                $values:
                  - "ms-vscode.cpptools"
                  - "platformio.platformio-ide"
          runArgs:
            $arrayMerge: append
            $values:
              - "--env-file"
              - "$${localEnv:HOME}/.secrets/.env.chromance"

  - git: https://github.com/anthony-spruyt/claude-plugins.git
    groups:
      - claude
      - agent-kit
      - mcp
      - github-ci
      - github-trivy
      - megalinter
      - megalinter-flavor
      - mergify
      - protected-main-branch
      - python
      - release-please
      - renovate
      - sonar

  - git: https://github.com/anthony-spruyt/container-images.git
    groups:
      - claude
      - agent-kit
      - mcp
      - github-ci
      - github-trivy
      - megalinter
      - megalinter-flavor
      - protected-main-branch
      - image
      - python
      - mergify
      - renovate
      - sonar
    files:
      .mergify.yml:
        vars:
          gateFilesExtra: '[^/]+/(test\.sh|flavor\.yaml)$|megalinter-factory/|devcontainer-common/|'
    settings:
      labels:
        "renovate/upstream":
          color: "#ededed"
          description: ""
      rulesets:
        pr-rules:
          rules:
            $arrayMerge: merge
            $values:
              - type: required_status_checks
                parameters:
                  requiredStatusChecks:
                    $arrayMerge: append
                    $values:
                      # A flavor losing a linter must ship as a major release, not a patch
                      - context: "Guard Linter Removals"
                        integrationId: 15368

  - git: https://github.com/anthony-spruyt/esphome.git
    groups:
      - claude
      - agent-kit
      - mcp
      - dismiss-stale-approvals
      - megalinter-flavor
      - mergify
      - renovate
    files:
      .claude/rules/tdd.md: false
      .devcontainer/devcontainer.json:
        content:
          customizations:
            vscode:
              extensions:
                $arrayMerge: append
                $values:
                  - "ESPHome.esphome-vscode"
      .vscode/settings.json:
        content:
          files.associations:
            "*.yaml": "esphome"
          esphome.dashboard.url: "http://localhost:6052"

  - git: https://github.com/anthony-spruyt/kata-tap-qdisc-fix.git
    groups:
      - claude
      - agent-kit
      - mcp
      - github-ci
      - github-trivy
      - megalinter
      - protected-main-branch
      - go-image
      - mergify
      - renovate
      - sonar
    settings:
      repo:
        description: "DaemonSet that fixes tap device qdiscs for Kata Containers on Cilium."

  - git: https://github.com/anthony-spruyt/litellm-middleware.git
    groups:
      - claude
      - agent-kit
      - mcp
      - github-ci
      - github-trivy
      - megalinter
      - protected-main-branch
      - python-image
      - mergify
      - renovate
      - sonar
    files:
      .github/workflows/ci.yaml:
        content:
          jobs:
            image:
              with: &litellm-middleware-with
                python-test-paths: |
                  tests/unit
                  tests/integration
      .github/workflows/release-please.yaml:
        content:
          jobs:
            images:
              with: *litellm-middleware-with
    settings:
      repo:
        description: "Custom LiteLLM proxy middleware, shipped as an OCI image."

  - git: https://github.com/anthony-spruyt/mcp-header-proxy.git
    groups:
      - claude
      - agent-kit
      - mcp
      - github-ci
      - github-trivy
      - megalinter
      - protected-main-branch
      - go-image
      - mergify
      - renovate
      - sonar
    settings:
      repo:
        description: "Sidecar proxy that injects headers into MCP requests."

  - git: https://github.com/anthony-spruyt/renovate-data.git
    files:
      inherit: false
    settings:
      codeScanning: false
      repo:
        description: "Renovate preset and data that the image-age workflow in repo-operator publishes."
        hasDiscussions: false
        hasIssues: false
        hasProjects: false
        hasWiki: false
      collaborators:
        inherit: false
        users: []
      labels:
        inherit: false

  - git: https://github.com/anthony-spruyt/repo-operator.git
    groups:
      - claude
      - agent-kit
      - mcp
      - github-ci
      - github-trivy
      - megalinter
      - megalinter-flavor
      - mergify
      - protected-main-branch
      - renovate
      - sonar
    files:
      # Repo-owned for good: it hosts XFG Plan and Apply, which the standard ci.yaml lacks
      .github/workflows/ci.yaml:
        createOnly: true
      .devcontainer/devcontainer.json:
        content:
          containerEnv:
            NODE_PATH: /usr/local/share/nvm/current/lib/node_modules
          features:
            "ghcr.io/devcontainers-extra/features/npm-package":
              package: "jsonata"
              # renovate: datasource=npm depName=jsonata
              version: "2.2.2"
      .mergify.yml:
        vars:
          gateFilesExtra: 'src/|test/ci/|lint\.sh$|'
    settings:
      labels:
        "xfg/plan":
          color: "#0E8A16"
          description: "Run XFG Plan (preview) on this PR"

  - git: https://github.com/anthony-spruyt/security.git
    groups:
      - private-repo
    files:
      inherit: false
    settings:
      repo:
        automatedSecurityFixes: false
        hasDiscussions: false
        hasIssues: true
        hasProjects: false
        hasWiki: false
        vulnerabilityAlerts: false
      labels:
        inherit: false

  - git: https://github.com/anthony-spruyt/spruyt-labs.git
    groups:
      - claude
      - agent-kit
      - mcp
      - dismiss-stale-approvals
      - github-ci
      - github-trivy
      - megalinter
      - go
      - image
      - terraform
      - mergify
      - renovate
      - sonar
    files:
      .github/ISSUE_TEMPLATE/infra.yml:
        content: "@templates/.github/ISSUE_TEMPLATE/infra.yml"
      .github/workflows/ci.yaml:
        content:
          jobs:
            repo:
              # Its ci-repo.yaml paths-filter needs these, and a called workflow can't exceed the caller job
              permissions:
                actions: "read"
                contents: "read"
                pull-requests: "read"
      lint.sh:
        vars:
          # renovate: datasource=docker depName=ghcr.io/anthony-spruyt/megalinter-spruyt-labs
          megalinterImage: "ghcr.io/anthony-spruyt/megalinter-spruyt-labs:v3.1.5@sha256:43c9812e13f1ca1f8b8e1dc74028739f3d6669c15a4042e6be96faf224aa0d56"
      .devcontainer/devcontainer.json:
        content:
          customizations:
            vscode:
              extensions:
                $arrayMerge: append
                $values:
                  - "task.vscode-task"
                  - "tim-koehler.helm-intellisense"
          features:
            "ghcr.io/devcontainers-extra/features/sops":
              # renovate: datasource=github-releases depName=getsops/sops
              version: "3.13.3"
          mounts:
            $arrayMerge: append
            $values:
              - "source=$${localEnv:HOME}/.secrets/age.key,target=/home/vscode/.secrets/age.key,type=bind,readonly"
              - "source=$${localEnv:HOME}/.secrets/bgp-65000.conf,target=/home/vscode/.secrets/bgp-65000.conf,type=bind,readonly"
              - "source=$${localEnv:HOME}/.secrets/kubeconfig,target=/home/vscode/.secrets/kubeconfig,type=bind,readonly"
              - "source=$${localEnv:HOME}/.secrets/talosconfig,target=/home/vscode/.secrets/talosconfig,type=bind"
          runArgs:
            $arrayMerge: append
            $values:
              - "--env-file"
              - "$${localEnv:HOME}/.secrets/.env.spruyt-labs"
      .vscode/settings.json:
        content:
          "search.exclude":
            "**/*.secret.*": true
            "**/temp/**": true
      .mcp.json:
        content:
          mcpServers:
            cclsp:
              type: "stdio"
              command: "cclsp"
              env:
                CCLSP_CONFIG_PATH: "/workspaces/spruyt-labs/.claude/cclsp.json"
      .mdformat.toml:
        content: |
          wrap = 400
          number = true
          end_of_line = "lf"

          # Python 3.13+ only
          exclude = [
              "cluster/apps/n8n-system/n8n/app/prompts/**",
          ]
      .pre-commit-config.yaml:
        content:
          repos:
            $arrayMerge: append
            $values:
              - repo: https://github.com/k8s-at-home/sops-pre-commit
                # renovate: depName=k8s-at-home/sops-pre-commit datasource=github-tags
                rev: v2.1.1
                hooks:
                  - id: forbid-secrets
              - repo: local
                hooks:
                  - id: grafana-dashboard-unescaped-vars
                    name: Grafana dashboard variables must be escaped with a double $ (Flux substitution blanks them)
                    language: pygrep
                    entry: '(^|[^$])\$\{'
                    files: '^cluster/apps/observability/victoria-metrics-k8s-stack/app/dashboards/.*\.json$'
      .yamllint.yml:
        content:
          ignore: |
            *.sops.*
            talos/
            clusterconfig/
            legacy/
            .taskfiles/talos/scripts/
      trivy-mega-linter.yaml:
        content:
          scan:
            skip-dirs:
              - talos/clusterconfig
    settings:
      repo:
        allowAutoMerge: false
      labels:
        alert:
          color: "#e11d48"
          description: "Auto-created alert triage issue"
        mcp-tool-drift:
          color: "#fbca04"
          description: "LiteLLM MCP tool list drift"
        sre:
          color: "#7c3aed"
          description: "SRE investigation or triage"

  - git: https://github.com/anthony-spruyt/SunGather.git
    groups:
      - claude
      - agent-kit
      - mcp
      - github-ci
      - github-trivy
      - megalinter
      - protected-main-branch
      - python-image
      - mergify
      - renovate
      - sonar
    files:
      .github/workflows/ci.yaml:
        content:
          jobs:
            image:
              with: &sungather-with
                # GHCR names must be lowercase and the repo name is not
                image: "sungather"
                test-command: 'docker run --rm --network none "$IMAGE_REF" /opt/virtualenv/bin/sungather -h'
      .github/workflows/release-please.yaml:
        content:
          jobs:
            images:
              with: *sungather-with
      .mcp.json:
        content:
          mcpServers:
            cclsp:
              type: "stdio"
              command: "cclsp"
              env:
                CCLSP_CONFIG_PATH: "/workspaces/SunGather/.claude/cclsp.json"

  - git: https://github.com/anthony-spruyt/traefik-api-key-auth.git
    groups:
      - claude
      - agent-kit
      - mcp
      - github-ci
      - github-trivy
      - megalinter
      - protected-main-branch
      - go-image
      - mergify
      - renovate
      - sonar
    files:
      # Fork of linkphoenix/traefik-api-key-auth - must keep the upstream ISC license
      LICENSE: false
      .mergify.yml:
        vars:
          gateFilesExtra: 'scripts/test-image\.sh$|'
      .github/workflows/ci.yaml:
        content:
          jobs:
            image:
              with: &traefik-api-key-auth-with
                test-command: "./scripts/test-image.sh"
      .github/workflows/release-please.yaml:
        content:
          jobs:
            images:
              with: *traefik-api-key-auth-with
      .golangci.yml:
        content:
          linters:
            enable:
              $arrayMerge: append
              $values:
                - depguard
            settings:
              depguard:
                rules:
                  yaegi:
                    deny:
                      - pkg: "unsafe"
                        desc: "Traefik's Yaegi interpreter does not allow unsafe"
                      - pkg: "syscall"
                        desc: "Traefik's Yaegi interpreter does not allow syscall"
    settings:
      repo:
        description: "Traefik middleware plugin for API key authentication."

  - git: https://github.com/anthony-spruyt/xfg.git
    groups:
      - claude
      - agent-kit
      - mcp
      - github-ci
      - github-trivy
      - megalinter
      - megalinter-flavor
      - protected-main-branch
      - typescript
      - eslint
      - mergify
      - release-please
      - renovate
      - sonar
    files:
      # Publishes from its own release.yaml, the filename npm Trusted Publishing matches
      .github/workflows/release-please.yaml: false
      # A label other than run-integration must not post a green summary over a failed run
      .github/workflows/ci.yaml:
        content:
          on:
            pull_request:
              types:
                - "opened"
                - "synchronize"
                - "reopened"
                - "labeled"
          jobs:
            lint:
              if: "github.event.action != 'labeled' || github.event.label.name == 'run-integration'"
            repo:
              if: "github.event.action != 'labeled' || github.event.label.name == 'run-integration'"
            image:
              if: "github.event.action != 'labeled' || github.event.label.name == 'run-integration'"
            sonar:
              if: "github.event.action != 'labeled' || github.event.label.name == 'run-integration'"
            summary:
              if: "always() && (github.event.action != 'labeled' || github.event.label.name == 'run-integration')"
      .devcontainer/devcontainer.json:
        content:
          features:
            "ghcr.io/devcontainers/features/azure-cli":
              # renovate: datasource=github-releases depName=Azure/azure-cli
              version: "2.91.0"
          runArgs:
            $arrayMerge: append
            $values:
              - "--env-file"
              - "$${localEnv:HOME}/.secrets/.env.xfg"
      .vscode/settings.json:
        content:
          "files.exclude":
            "dist/": true
            "node_modules/": true
            "site/": true
            "tmp/": true
          "search.exclude":
            "coverage": true
            ".output": true
      .mcp.json:
        content:
          mcpServers:
            cclsp:
              type: "stdio"
              command: "cclsp"
              env:
                CCLSP_CONFIG_PATH: "/workspaces/xfg/.claude/cclsp.json"
    settings:
      repo:
        hasDiscussions: true
      labels:
        "run-integration":
          color: "#0E8A16"
          description: "Trigger integration tests on this PR"
        # docs/requirements.txt gets pip PRs with this label though xfg is not in the python group
        "renovate/python":
          color: "#ededed"
          description: ""
      # Publish runs on v*.*.* tags and docs deploy on vN tags; a repo-level policy replaces the group's, so main is restated
      environments:
        deleteOrphaned: false
        release:
          deploymentBranchPolicy:
            custom:
              - type: branch
                name: main
              - type: tag
                name: "v*"
        integration:
          secrets:
            deleteOrphaned: false
            LITELLM_HOST:
              env: LITELLM_HOST
            LITELLM_API_KEY:
              env: LITELLM_API_KEY
            CF_ACCESS_CLIENT_ID:
              env: CF_ACCESS_CLIENT_ID
            CF_ACCESS_CLIENT_SECRET:
              env: CF_ACCESS_CLIENT_SECRET
        integration-main:
          deploymentBranchPolicy:
            custom:
              - type: branch
                name: main
          secrets:
            deleteOrphaned: false
            LITELLM_HOST:
              env: LITELLM_HOST
            LITELLM_API_KEY:
              env: LITELLM_API_KEY
            CF_ACCESS_CLIENT_ID:
              env: CF_ACCESS_CLIENT_ID
            CF_ACCESS_CLIENT_SECRET:
              env: CF_ACCESS_CLIENT_SECRET
      rulesets:
        branch-signatures:
          conditions:
            refName:
              exclude:
                $arrayMerge: append
                $values:
                  - "refs/heads/gh-pages"
