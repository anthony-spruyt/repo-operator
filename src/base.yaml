# yaml-language-server: $schema=https://raw.githubusercontent.com/anthony-spruyt/xfg/main/config-schema.json
# Configuration for repo-operator - syncs files to target repositories
id: repo-operator
deleteOrphaned: true
prOptions:
  merge: direct
  ai:
    provider: openai
    baseUrl: https://openrouter.ai/api/v1
    model: anthropic/claude-haiku-5.5
    apiKeyEnv: OPENROUTER_API_KEY
    prompt: >-
      These commits sync shared tooling config, never product code, and
      release-please reads their type in the target repos. Use only the types
      chore, ci, build, docs or style. Never use feat, fix, perf or refactor,
      and never mark a breaking change.
