# yaml-language-server: $schema=https://raw.githubusercontent.com/anthony-spruyt/xfg/main/config-schema.json
groups:
  agent-kit:
    files:
      .claude/rules/orchestration.md:
        content: "@templates/.claude/rules/orchestration.md"
      .claude/rules/do-it-yourself.md:
        content: "@templates/.claude/rules/do-it-yourself.md"
      .claude/agents/builder.md:
        content: "@templates/.claude/agents/builder.md"
      .claude/agents/reviewer.md:
        content: "@templates/.claude/agents/reviewer.md"
      .claude/agents/chore-runner.md:
        content: "@templates/.claude/agents/chore-runner.md"
      .claude/skills/orchestration/SKILL.md:
        content: "@templates/.claude/skills/orchestration/SKILL.md"
      .claude/skills/interview/SKILL.md:
        content: "@templates/.claude/skills/interview/SKILL.md"
      .claude/skills/spec-review/SKILL.md:
        content: "@templates/.claude/skills/spec-review/SKILL.md"
      .claude/skills/spec-review/review-brief.md:
        content: "@templates/.claude/skills/spec-review/review-brief.md"
      .claude/skills/orchestration-retro/SKILL.md:
        content: "@templates/.claude/skills/orchestration-retro/SKILL.md"
      .claude/skills/orchestration-retro/retro.sh:
        content: "@templates/.claude/skills/orchestration-retro/retro.sh"
  biome:
    files:
      biome.json:
        content: "@templates/biome.json"
  claude:
    files:
      .agent-progress/.gitignore:
        content: "@templates/.agent-progress/.gitignore"
      .devcontainer/post-start.d/claude-plugins.sh:
        content: "@templates/.devcontainer/post-start.d/claude-plugins.sh"
      .devcontainer/post-start.d/claude-state.sh:
        content: "@templates/.devcontainer/post-start.d/claude-state.sh"
      .claude/agents/Explore.md:
        content: "@templates/.claude/agents/Explore.md"
      .claude/output-styles/eli5.md:
        content: "@templates/.claude/output-styles/eli5.md"
      .claude/hookify-plus/warn-comment-density.md:
        content: "@templates/.claude/hookify-plus/warn-comment-density.md"
      .claude/hookify-plus/warn-raw-container-run.md:
        content: "@templates/.claude/hookify-plus/warn-raw-container-run.md"
      .claude/rules/comments.md:
        content: "@templates/.claude/rules/comments.md"
      .claude/rules/github.md:
        content: "@templates/.claude/rules/github.md"
      .claude/rules/research.md:
        content: "@templates/.claude/rules/research.md"
      .claude/rules/root-cause.md:
        content: "@templates/.claude/rules/root-cause.md"
      .claude/rules/tdd.md:
        content: "@templates/.claude/rules/tdd.md"
      .claude/skills/project-wrap-up/SKILL.md:
        content: "@templates/.claude/skills/project-wrap-up/SKILL.md"
      .claude/skills/repo-operator/SKILL.md:
        content: "@templates/.claude/skills/repo-operator/SKILL.md"
      .claude/pull-default-branch.sh:
        content: "@templates/.claude/pull-default-branch.sh"
      .claude/restore-shell-tools.sh:
        content: "@templates/.claude/restore-shell-tools.sh"
      .claude/settings.json:
        content: "@templates/.claude/settings.json"
      .claude/statusline.sh:
        content: "@templates/.claude/statusline.sh"
      .claude/xfg-managed.sh:
        content: "@templates/.claude/xfg-managed.sh"
      .github/ISSUE_TEMPLATE/bug_report.yml:
        content: "@templates/.github/ISSUE_TEMPLATE/bug_report.yml"
      .github/ISSUE_TEMPLATE/chore.yml:
        content: "@templates/.github/ISSUE_TEMPLATE/chore.yml"
      .github/ISSUE_TEMPLATE/config.yml:
        content: "@templates/.github/ISSUE_TEMPLATE/config.yml"
      .github/ISSUE_TEMPLATE/docs.yml:
        content: "@templates/.github/ISSUE_TEMPLATE/docs.yml"
      .github/ISSUE_TEMPLATE/feature_request.yml:
        content: "@templates/.github/ISSUE_TEMPLATE/feature_request.yml"
      .github/pull_request_template.md:
        content: "@templates/.github/pull_request_template.md"
      .pre-commit-config.yaml:
        content:
          repos:
            $arrayMerge: append
            $values:
              - repo: local
                hooks:
                  - id: xfg-managed
                    name: Block changes to files synced by repo-operator
                    entry: bash .claude/xfg-managed.sh staged
                    language: system
                    pass_filenames: false
                    always_run: true
  cpp: {}
  eslint:
    files:
      eslint.config.js:
        content: "@templates/eslint.config.js"
  dotnet:
    files:
      .devcontainer/devcontainer.json:
        content:
          features:
            "ghcr.io/devcontainers/features/dotnet":
              # renovate: datasource=dotnet-version depName=dotnet-sdk
              version: "10.0.402"
          customizations:
            vscode:
              extensions:
                $arrayMerge: append
                $values:
                  - "ms-dotnettools.csdevkit"
  dismiss-stale-approvals:
    settings:
      rulesets:
        pr-reviews:
          bypassActors:
            - actorId: 2758555 # repo-operator
              actorType: Integration
              bypassMode: always
            - actorId: 99536297 # anthony-spruyt
              actorType: User
              bypassMode: always
            - actorId: 272440587 # spruyt-labs-bot
              actorType: User
              bypassMode: always
            - actorId: 3233443 # skynet-rw
              actorType: Integration
              bypassMode: pull_request
            - actorId: 10562 # mergify: exempt per Mergify rulesets docs
              actorType: Integration
              bypassMode: exempt
          conditions:
            refName:
              include:
                - "refs/heads/main"
              exclude: []
          enforcement: active
          rules:
            - type: pull_request
              parameters:
                allowedMergeMethods:
                  - squash
                dismissStaleReviewsOnPush: true
                requireCodeOwnerReview: false
                requireExtraApprovalForUnattributedChanges: false
                requiredApprovingReviewCount: 1
                requiredReviewers: []
                requiredReviewThreadResolution: false
                requireLastPushApproval: false
          target: branch
  dockerhub:
    settings:
      environments:
        release:
          deploymentBranchPolicy:
            custom:
              - type: branch
                name: main
          secrets:
            DOCKERHUB_TOKEN:
              env: DOCKERHUB_TOKEN
        publish:
          deploymentBranchPolicy:
            custom:
              - type: branch
                name: main
              - type: tag
                name: "*.*.*"
              - type: tag
                name: "*/*.*.*"
          secrets:
            DOCKERHUB_TOKEN:
              env: DOCKERHUB_TOKEN
  github:
    files:
      .github/actionlint.yaml:
        createOnly: true
        header:
          - https://github.com/rhysd/actionlint/blob/main/docs/config.md
          - Ignore shellcheck warnings in all workflows
          - "SC2153: Uppercase env vars from GitHub Actions workflow env blocks"
          - "SC2034: Variables used in heredocs appear unused"
        content: "@templates/.github/actionlint.yaml"
      .pre-commit-config.yaml:
        content:
          repos:
            $arrayMerge: append
            $values:
              - repo: https://github.com/rhysd/actionlint
                # renovate: depName=rhysd/actionlint datasource=github-tags
                rev: v1.7.12
                hooks:
                  - id: actionlint
  github-ci:
    extends:
      - github
      - megalinter
    files:
      .devcontainer/devcontainer.json:
        content:
          customizations:
            vscode:
              extensions:
                $arrayMerge: append
                $values:
                  - "github.vscode-github-actions"
      .github/workflows/ci.yaml:
        schemaUrl: https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
        header: See https://github.com/anthony-spruyt/repo-operator/blob/main/src/templates/.github/workflows/ci.yaml for template comments
        content: "@templates/.github/workflows/ci.yaml"
      .github/workflows/ci-repo.yaml:
        createOnly: true
        schemaUrl: https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
        header: Repo-owned CI jobs; ci.yaml calls this after lint. See https://github.com/anthony-spruyt/repo-operator/blob/main/docs/ci.md
        content: "@templates/.github/workflows/ci-repo.yaml"
      .github/workflows/pr-title.yaml:
        schemaUrl: https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
        header: See https://github.com/anthony-spruyt/repo-operator/blob/main/src/templates/.github/workflows/pr-title.yaml for template comments
        content: "@templates/.github/workflows/pr-title.yaml"
  image:
    extends:
      - github-ci
      - release-please
      - dockerhub
    files:
      # language is not "": _build-image.yaml rejects an empty language for an image whose metadata.yaml sets none
      .github/workflows/release-please.yaml:
        template: true
        schemaUrl: https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
        header: This file is automatically updated - do not modify directly
        vars:
          language: none
        content: "@templates/.github/workflows/image-release-please.yaml"
      .hadolint.yaml:
        createOnly: true
        content: "@templates/.hadolint.yaml"
      .github/workflows/container-retention.yaml:
        schemaUrl: https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
        header: This file is automatically updated - do not modify directly
        template: true
        content: "@templates/.github/workflows/image-container-retention.yaml"
  go-image:
    extends:
      - image
      - go
      - megalinter-flavor
    files:
      .github/workflows/ci.yaml:
        content:
          jobs:
            image:
              with:
                language: "go"
      .github/workflows/release-please.yaml:
        vars:
          language: go
  python-image:
    extends:
      - image
      - python
      - megalinter-flavor
    files:
      .github/workflows/ci.yaml:
        content:
          jobs:
            image:
              with:
                language: "python"
      .github/workflows/release-please.yaml:
        vars:
          language: python
  github-trivy:
    extends: github
    files:
      .github/workflows/trivy-scan.yaml:
        schemaUrl: https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
        header: See https://github.com/anthony-spruyt/repo-operator/blob/main/src/templates/.github/workflows/trivy-scan.yaml for template comments
        content: "@templates/.github/workflows/trivy-scan.yaml"
      .claude/hookify-plus/warn-code-scanning-ref.md:
        content: "@templates/.claude/hookify-plus/warn-code-scanning-ref.md"
      .claude/hookify-plus/warn-trivy-sarif.md:
        content: "@templates/.claude/hookify-plus/warn-trivy-sarif.md"
    settings:
      secrets:
        GHCR_READ_TOKEN:
          env: GHCR_READ_TOKEN
  go:
    files:
      .devcontainer/devcontainer.json:
        content:
          features:
            "ghcr.io/devcontainers/features/go":
              # renovate: datasource=golang-version depName=go
              version: "1.27.3"
          customizations:
            vscode:
              extensions:
                $arrayMerge: append
                $values:
                  - "golang.go"
      .pre-commit-config.yaml:
        content:
          repos:
            $arrayMerge: append
            $values:
              - repo: https://github.com/Lucas-C/pre-commit-hooks
                # renovate: depName=Lucas-C/pre-commit-hooks datasource=github-tags
                rev: v1.5.6
                hooks:
                  - id: remove-crlf
                  - id: remove-tabs
                    args: [--whitespaces-count, "2"]
                    exclude: '(\.go|go\.mod|go\.sum)$'
  mcp:
    files:
      .mcp.json:
        content: "@templates/.mcp.json"
  megalinter:
    files:
      .vscode/settings.json:
        content:
          search.exclude:
            ".output/updated_sources": true
      .lycheeignore:
        createOnly: true
        content: "@templates/.lycheeignore"
      .mega-linter.yml:
        createOnly: true
        schemaUrl: https://raw.githubusercontent.com/oxsecurity/megalinter/main/megalinter/descriptors/schemas/megalinter-configuration.jsonschema.json
        header:
          - Project-specific MegaLinter configuration
          - Extends the base config from repo-operator
          - Add custom linters or overrides below
          - "Add project-specific linters below:"
          - "ENABLE_LINTERS:"
          - "  - TYPESCRIPT_ES"
          - "  - PYTHON_RUFF"
          - "Exclude more directories without dropping the base ones:"
          - "ADDITIONAL_EXCLUDED_DIRECTORIES:"
          - "  - generated"
        content: "@templates/.mega-linter.yml"
      .mega-linter-base.yml:
        schemaUrl: https://raw.githubusercontent.com/oxsecurity/megalinter/main/megalinter/descriptors/schemas/megalinter-configuration.jsonschema.json
        header:
          - Base MegaLinter configuration synced from repo-operator
          - This file is automatically updated - do not modify directly
          - To add custom linters, modify .mega-linter.yml instead
        content: "@templates/.mega-linter-base.yml"
      .secretlintignore:
        createOnly: true
        content: "@templates/.secretlintignore"
      .shellcheckrc:
        createOnly: true
      lint.sh:
        template: true
        content: "@templates/lint.sh.tmpl"
      trivy-mega-linter.yaml:
        schemaUrl: https://raw.githubusercontent.com/aquasecurity/trivy/main/schema/trivy-config.json
        header:
          - This file is automatically updated - do not modify directly
          - https://trivy.dev/latest/docs/references/configuration/config-file/
        content: "@templates/trivy-mega-linter.yaml"
  megalinter-flavor:
    extends: megalinter
  mergify:
    extends:
      - github-ci
    files:
      .mergify.yml:
        template: true
        vars:
          gateFilesExtra: ""
        content: "@templates/.mergify.yml"
    settings:
      repo:
        allowAutoMerge: false
      labels:
        "agent/auto-approved":
          color: "#0e8a16"
          description: "Automatically approved"
        "agent/fixable":
          color: "#fbca04"
          description: "Agent found fixable issues"
        "agent/fixing":
          color: "#e4e669"
          description: "Agent is working on fixes"
        "agent/needs-human-review":
          color: "#d93f0b"
          description: "Needs review by the owner"
        "agent/needs-triage":
          color: "#bfd4f2"
          description: "Queued for agent triage"
        "agent/revert":
          color: "#b60205"
          description: "Automated revert PR"
        "agent/safe":
          color: "#0e8a16"
          description: "Agent approved - safe to merge"
        "agent/triage":
          color: "#ededed"
          description: "Agent is triaging PR"
        dequeued:
          color: "#311812"
          description: "Mergify dequeued"
        "emergency/merge":
          color: "#b60205"
          description: "Break glass - bypass agent triage"
        queued:
          color: "#4f3fea"
          description: "Mergify queued"
  private-repo:
    settings:
      codeScanning: false
      repo:
        allowAutoMerge: false
        privateVulnerabilityReporting: false
        secretScanning: false
        secretScanningPushProtection: false
        visibility: private
      rulesets:
        inherit: false
  protected-main-branch:
    settings:
      rulesets:
        pr-rules:
          bypassActors:
            $arrayMerge: append
            $values:
              - actorId: 2758555 # repo-operator: xfg sync pushes straight to main (prOptions.merge: direct)
                actorType: Integration
                bypassMode: always
          conditions:
            refName:
              include:
                - "refs/heads/main"
              exclude: []
          enforcement: active
          rules:
            $arrayMerge: append
            $values:
              - type: code_quality
                parameters:
                  severity: errors
              - type: code_scanning
                parameters:
                  codeScanningTools:
                    - tool: CodeQL
                      alertsThreshold: errors
                      securityAlertsThreshold: high_or_higher
              - type: pull_request
                parameters:
                  allowedMergeMethods:
                    - squash
                  dismissStaleReviewsOnPush: true
                  requireCodeOwnerReview: false
                  requireExtraApprovalForUnattributedChanges: true
                  requiredApprovingReviewCount: 1
                  requiredReviewers: []
                  requiredReviewThreadResolution: true
                  requireLastPushApproval: true
          target: branch
  python: {}
  release-please:
    files:
      .github/workflows/release-please.yaml:
        schemaUrl: https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
        header: This file is automatically updated - do not modify directly
        content: "@templates/.github/workflows/release-please.yaml"
    settings:
      environments:
        release:
          deploymentBranchPolicy:
            custom:
              - type: branch
                name: main
          secrets:
            RELEASE_PLEASE_APP_CLIENT_ID:
              env: RELEASE_PLEASE_APP_CLIENT_ID
            RELEASE_PLEASE_APP_PRIVATE_KEY:
              env: RELEASE_PLEASE_APP_PRIVATE_KEY
      rulesets:
        tag-rules:
          bypassActors:
            $arrayMerge: append
            $values:
              - actorId: 4745999 # repo-operator-release-bot: creates release tags and moves xfg's floating vN tag
                actorType: Integration
                bypassMode: always
  renovate:
    files:
      .devcontainer/devcontainer.json:
        content:
          features:
            "ghcr.io/devcontainers-extra/features/renovate-cli":
              # renovate: datasource=npm depName=renovate
              version: "44.151.2"
      renovate.json:
        template: true
        content: "@templates/renovate.json5"
      renovate-overrides.json5:
        createOnly: true
        content: "@templates/renovate-overrides.json5"
    settings:
      labels:
        "renovate/devcontainer":
          color: "#ededed"
          description: ""
        "renovate/flux":
          color: "#ededed"
          description: ""
        "renovate/helm":
          color: "#ededed"
          description: ""
        "renovate/helm-values":
          color: "#ededed"
          description: ""
        "renovate/image":
          color: "#ededed"
          description: ""
        "renovate/kubernetes":
          color: "#ededed"
          description: ""
        "renovate/npm":
          color: "#ededed"
          description: ""
        "renovate/pre-commit":
          color: "#ededed"
          description: ""
        "renovate/renovate-cli":
          color: "#ededed"
          description: ""
        "renovate/script":
          color: "#ededed"
          description: ""
        "renovate/talos":
          color: "#ededed"
          description: ""
        "renovate/taskfile":
          color: "#ededed"
          description: ""
  sonar:
    files:
      .github/workflows/ci.yaml:
        content:
          jobs:
            sonar:
              permissions: {}
              uses: "anthony-spruyt/repo-operator/.github/workflows/_sonar-new-issues.yaml@942f23ee1700d246fa33d04d171d17bb696afb9f" # main
            summary:
              needs:
                $arrayMerge: append
                $values:
                  - "sonar"
      .sonarcloud.properties:
        createOnly: true
        content: "@templates/.sonarcloud.properties"
  terraform:
    files:
      .devcontainer/devcontainer.json:
        content:
          features:
            "ghcr.io/devcontainers/features/terraform":
              # renovate: datasource=github-releases depName=hashicorp/terraform
              version: "1.16.6"
          mounts:
            $arrayMerge: append
            $values:
              - "source=${localEnv:HOME}/.secrets/.terraform.d,target=/home/vscode/.terraform.d,type=bind,readonly"
          customizations:
            vscode:
              extensions:
                $arrayMerge: append
                $values:
                  - "hashicorp.terraform"
      .pre-commit-config.yaml:
        content:
          repos:
            $arrayMerge: append
            $values:
              # NOTE: files pattern assumes infra/terraform/ directory structure - override per-repo if needed
              - repo: https://github.com/antonbabenko/pre-commit-terraform
                # renovate: depName=antonbabenko/pre-commit-terraform datasource=github-tags
                rev: v1.109.2
                hooks:
                  - id: terraform_fmt
                    files: "^(infra/terraform|coder)/"
                  - id: terraform_tflint
                    files: "^(infra/terraform|coder)/"
      .vscode/settings.json:
        content:
          "[terraform]":
            "editor.defaultFormatter": "hashicorp.terraform"
  typescript: {}

conditionalGroups:
  - when:
      allOf: [claude]
      noneOf: [private-repo]
    files:
      .claude/rules/public-repos.md:
        content: "@templates/.claude/rules/public-repos.md"
  - when:
      noneOf: [go]
    files:
      .pre-commit-config.yaml:
        content:
          repos:
            $arrayMerge: append
            $values:
              - repo: https://github.com/Lucas-C/pre-commit-hooks
                # renovate: depName=Lucas-C/pre-commit-hooks datasource=github-tags
                rev: v1.5.6
                hooks:
                  - id: remove-crlf
                  - id: remove-tabs
                    args: [--whitespaces-count, "2"]
  - when:
      allOf: [megalinter-flavor]
      noneOf: [cpp, go, python, typescript]
    files:
      lint.sh:
        vars:
          # renovate: datasource=docker depName=ghcr.io/anthony-spruyt/megalinter-base
          megalinterImage: "ghcr.io/anthony-spruyt/megalinter-base:1.0.4@sha256:4f62fadea2d7cfb24ff7b4dacc5538412f8568b820c7c0e7e1dc6ba6b8fc7c20"
  - when:
      allOf: [megalinter-flavor, cpp]
      noneOf: [go, typescript]
    files:
      lint.sh:
        vars:
          # renovate: datasource=docker depName=ghcr.io/anthony-spruyt/megalinter-cpp
          megalinterImage: "ghcr.io/anthony-spruyt/megalinter-cpp:1.1.4@sha256:b2371ceada7d5b9436b39090f10fac0adc62604b89d6bb368466305cb8cbe0dc"
  - when:
      allOf: [megalinter-flavor, go]
      noneOf: [cpp, python, typescript]
    files:
      lint.sh:
        vars:
          # renovate: datasource=docker depName=ghcr.io/anthony-spruyt/megalinter-go
          megalinterImage: "ghcr.io/anthony-spruyt/megalinter-go:2.1.4@sha256:72f7583cd1d8622a605b6955b8781014da52ad5a3b966af5c5462b4df6d76f29"
  - when:
      allOf: [megalinter-flavor, python]
      noneOf: [cpp, go, typescript]
    files:
      lint.sh:
        vars:
          # renovate: datasource=docker depName=ghcr.io/anthony-spruyt/megalinter-python
          megalinterImage: "ghcr.io/anthony-spruyt/megalinter-python:1.1.4@sha256:55c78fb7dcd93768bbe580d4b0c39f7e617aa93b18748fbb245dc28f17e4aec7"
  - when:
      allOf: [megalinter-flavor, typescript]
      noneOf: [cpp, go, python]
    files:
      lint.sh:
        vars:
          # renovate: datasource=docker depName=ghcr.io/anthony-spruyt/megalinter-typescript
          megalinterImage: "ghcr.io/anthony-spruyt/megalinter-typescript:1.0.4@sha256:7812460f6b94235dfc9bcff606cd79d1b61f4abd2d6dd921df5fede40dc986f2"
  - when:
      allOf: [megalinter-flavor, go]
    files:
      .golangci.yml:
        template: true
        schemaUrl: https://golangci-lint.run/jsonschema/golangci.jsonschema.json
        header: This file is automatically updated - do not modify directly
        content: "@templates/.golangci.yml"
      .mega-linter-base.yml:
        content:
          ENABLE_LINTERS:
            $arrayMerge: append
            $values:
              - "GO_GOLANGCI_LINT"
  - when:
      allOf: [megalinter-flavor, python]
    files:
      ruff-base.toml:
        content: "@templates/ruff-base.toml"
      .mega-linter-base.yml:
        content:
          ENABLE_LINTERS:
            $arrayMerge: append
            $values:
              - "PYTHON_RUFF"
              - "PYTHON_RUFF_FORMAT"
