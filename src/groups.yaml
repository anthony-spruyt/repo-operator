                  requiredStatusChecks:
                    - context: "summary / Check Results"
                      integrationId: 15368
                    - context: "PR Title"
                      integrationId: 15368
                    - context: "SonarCloud Code Analysis"
                      integrationId: 12526
                  strictRequiredStatusChecksPolicy: false
  - when:
      allOf: [mergify, protected-main-branch, github-ci, sonar]
    settings:
      rulesets:
        pr-rules:
          rules:
            $arrayMerge: append
            $values:
              - type: required_status_checks
                parameters:
                  doNotEnforceOnCreate: false
                  requiredStatusChecks:
                    - context: "summary / Check Results"
                      integrationId: 15368
                    - context: "PR Title"
                      integrationId: 15368
                    - context: "Mergify Merge Protections"
                      integrationId: 10562
                    - context: "SonarCloud Code Analysis"
                      integrationId: 12526
                  strictRequiredStatusChecksPolicy: false
  - when:
      allOf: [mergify, protected-main-branch, github-ci]
      noneOf: [sonar]
    settings:
      rulesets:
        pr-rules:
          rules:
            $arrayMerge: append
            $values:
              - type: required_status_checks
                parameters:
                  doNotEnforceOnCreate: false
                  requiredStatusChecks:
                    - context: "summary / Check Results"
                      integrationId: 15368
                    - context: "PR Title"
                      integrationId: 15368
                    - context: "Mergify Merge Protections"
                      integrationId: 10562
                  strictRequiredStatusChecksPolicy: false
  - when:
      allOf: [renovate]
