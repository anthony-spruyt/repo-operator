---
name: Harden Runner
description: >-
  Run step-security/harden-runner with the egress policy every repo-operator
  job shares. The policy, audit or block, is the egress-policy of the one step
  below, so a change to it reaches every caller.
inputs:
  allowed-endpoints:
    description: host:port endpoints a job may reach when the policy is block
    required: false
    default: ""
  disable-sudo-and-containers:
    description: Disable sudo and container access for the runner account
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Harden Runner
      uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
      with:
        egress-policy: block
        allowed-endpoints: ${{ inputs.allowed-endpoints }}
        disable-sudo-and-containers: ${{ inputs.disable-sudo-and-containers }}
