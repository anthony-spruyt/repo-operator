---
# Caller must check out the repo first: fetch-depth 0 on pull requests, 2 or more on pushes.
name: Detect Images
description: >-
  List the repo's images as a build matrix: release-please packages whose path
  holds a Dockerfile or flavor.yaml, with settings from <path>/metadata.yaml.
  By default only images whose files changed: against the merge base with
  base-sha on a pull request, else against HEAD~1. On a pull request the
  config at base-sha selects images too, so a PR can't drop its own build.
inputs:
  mode:
    description: >-
      changed (images whose files changed), all (every image, without diffing)
      or released (images release-please just released, with their tags)
    required: false
    default: changed
  image:
    description: >-
      Select exactly this image. Fails when the repo has no such image. Released
      mode refuses it
    required: false
    default: ""
  base-sha:
    description: >-
      Base commit to diff against through the merge base; its
      release-please-config.json selects images too. Empty diffs HEAD~1
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  releases:
    description: released mode only, the release-please-action outputs as JSON (toJSON(steps.<id>.outputs))
    required: false
    default: ""
  root-name:
    description: Image name for a package at the repo root. Empty uses the lowercased repo name
    required: false
    default: ""
outputs:
  matrix:
    description: >-
      JSON matrix, {"include":[...]}, one entry per image. In released mode each
      entry also has version, tag-name (the git tag) and tag-prefix (the docker tag's)
    value: ${{ steps.detect.outputs.matrix }}
  has-images:
    description: '"true" when the matrix holds at least one image, else "false"'
    value: ${{ steps.detect.outputs.has-images }}
runs:
  using: composite
  steps:
    - name: Detect images
      id: detect
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        IMAGE: ${{ inputs.image }}
        BASE_SHA: ${{ inputs.base-sha }}
        RELEASES: ${{ inputs.releases }}
        REPO_NAME: ${{ inputs.root-name }}
        DETECT_SCRIPT: ${{ github.action_path }}/detect.sh
      run: '"$DETECT_SCRIPT"'
