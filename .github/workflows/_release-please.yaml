---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Release Please

on:
  workflow_call:
    inputs:
      language:
        description: Passed to _build-image.yaml for images whose metadata.yaml sets no language
        required: false
        type: string
        default: none
      image:
        description: Image name for a package at the repo root. Defaults to the lowercased repository name
        required: false
        type: string
        default: ""
      dockerhub-namespace:
        description: Passed to _build-image.yaml
        required: false
        type: string
        default: ""
      dockerhub-username:
        description: Passed to _build-image.yaml
        required: false
        type: string
        default: ""
      test-command:
        description: Passed to _build-image.yaml for images whose metadata.yaml sets no test-command
        required: false
        type: string
        default: ""
      python-version:
        description: Passed to _build-image.yaml
        required: false
        type: string
        default: ""
      python-groups:
        description: Passed to _build-image.yaml
        required: false
        type: string
        default: ""
      python-extras:
        description: Passed to _build-image.yaml
        required: false
        type: string
        default: ""
      python-test-paths:
        description: Passed to _build-image.yaml
        required: false
        type: string
        default: ""
      python-extra-commands:
        description: Passed to _build-image.yaml
        required: false
        type: string
        default: ""
    secrets:
      RELEASE_PLEASE_APP_CLIENT_ID:
        required: true
      RELEASE_PLEASE_APP_PRIVATE_KEY:
        required: true
      DOCKERHUB_TOKEN:
        required: false
    outputs:
      release-created:
        description: "'true' when this run created a release"
        value: ${{ jobs.release-please.outputs.release-created }}
      images:
        description: 'JSON matrix, {"include":[...]}, of the released images, each with its version and tag-name'
        value: ${{ jobs.detect.outputs.matrix }}

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release please
    runs-on: ubuntu-latest
    # release-please acts with the app token; GITHUB_TOKEN needs nothing.
    permissions:
      contents: read
    outputs:
      release-created: ${{ steps.release.outputs.releases_created }}
      releases: ${{ toJSON(steps.release.outputs) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      # GITHUB_TOKEN pull requests do not trigger the status checks that pr-rules requires.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

  detect:
    name: Detect
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has-images: ${{ steps.detect.outputs.has-images }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect released images
        id: detect
        uses: $/.github/actions/detect-images
        with:
          mode: released
          releases: ${{ needs.release-please.outputs.releases }}
          root-name: ${{ inputs.image }}

  build:
    name: ${{ matrix.name }}
    needs: detect
    if: needs.detect.outputs.has-images == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    uses: $/.github/workflows/_build-image.yaml
    with:
      language: ${{ matrix.language || inputs.language }}
      workdir: ${{ matrix.workdir }}
      image: ${{ matrix.name }}
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.dockerfile }}
      prepare-command: ${{ matrix.prepare-command }}
      free-disk: ${{ matrix.free-disk }}
      extra-tags: ${{ matrix.extra-tags }}
      push: true
      version: ${{ matrix.version }}
      tag-name: ${{ matrix.tag-name }}
      tag-prefix: ${{ matrix.tag-prefix }}
      dockerhub-namespace: ${{ inputs.dockerhub-namespace }}
      dockerhub-username: ${{ inputs.dockerhub-username }}
      test-command: ${{ matrix.test-command || inputs.test-command }}
      python-version: ${{ inputs.python-version }}
      python-groups: ${{ inputs.python-groups }}
      python-extras: ${{ inputs.python-extras }}
      python-test-paths: ${{ inputs.python-test-paths }}
      python-extra-commands: ${{ inputs.python-extra-commands }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
