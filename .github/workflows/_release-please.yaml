---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Release Please

on:
  workflow_call:
    secrets:
      RELEASE_PLEASE_APP_CLIENT_ID:
        required: true
      RELEASE_PLEASE_APP_PRIVATE_KEY:
        required: true
    outputs:
      release-created:
        description: "'true' when this run created a release"
        value: ${{ jobs.release-please.outputs.release-created }}
      releases:
        description: release-please's outputs as JSON, for _release-images.yaml
        value: ${{ jobs.release-please.outputs.releases }}

jobs:
  release-please:
    name: Release please
    runs-on: ubuntu-latest
    # Callers must still pass each secret by name, or it resolves empty even though the environment holds it.
    environment: release
    # release-please acts with the app token; GITHUB_TOKEN needs nothing.
    permissions:
      contents: read
    outputs:
      release-created: ${{ steps.release.outputs.releases_created }}
      releases: ${{ toJSON(steps.release.outputs) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            results-receiver.actions.githubusercontent.com:443

      # GITHUB_TOKEN pull requests do not trigger the status checks that pr-rules requires.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
