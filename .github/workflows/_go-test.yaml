---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Go Tests

on:
  workflow_call:
    inputs:
      workdir:
        description: Module root (the directory holding go.mod)
        required: false
        type: string
        default: "."
      dockerfile:
        description: Dockerfile of the image built from this module. Its ARG GO_VERSION, when set, is the Go the tests run on; otherwise the go.mod go directive is
        required: false
        type: string
        default: ""
      egress:
        description: Space-separated host:port endpoints this image's jobs reach besides the shared list (metadata.yaml egress)
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: Go Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.workdir }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443
            dl.google.com:443
            github.com:443
            go.dev:443
            objects.githubusercontent.com:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            *.blob.core.windows.net:443
            ${{ inputs.egress }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runs from the repo root: the Dockerfile path is not relative to workdir
      - name: Resolve Go version
        id: go
        working-directory: .
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          WORKDIR: ${{ inputs.workdir }}
        run: |
          version=""
          if [ -n "$DOCKERFILE" ] && [ -f "$DOCKERFILE" ]; then
            version=$(sed -n 's/^ARG GO_VERSION=\([0-9][0-9.]*\)[[:space:]]*$/\1/p' "$DOCKERFILE" | head -n 1)
          fi
          {
            echo "go-version=$version"
            if [ -n "$version" ]; then
              echo "go-version-file="
            else
              echo "go-version-file=$WORKDIR/go.mod"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.go-version }}
          go-version-file: ${{ steps.go.outputs.go-version-file }}
          # setup-go fails when no listed path exists, and dependency-free modules have no go.sum
          cache-dependency-path: |
            ${{ inputs.workdir }}/go.mod
            ${{ inputs.workdir }}/go.sum

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...
