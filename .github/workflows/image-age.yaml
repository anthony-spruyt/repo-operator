---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: "Image Age"

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: "image-age"
  cancel-in-progress: false

jobs:
  extract:
    name: "Extract images"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Extract images
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/image-age.sh extract --out "$RUNNER_TEMP/extract"

      - name: Upload inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inventory
          path: ${{ runner.temp }}/extract
          retention-days: 1

  render:
    name: "Date images"
    needs: extract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    outputs:
      preset-sha256: ${{ steps.hashes.outputs.preset }}
      data-sha256: ${{ steps.hashes.outputs.data }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            gcr.io:443
            ghcr.io:443
            github.com:443
            mcr.microsoft.com:443
            quay.io:443
            registry.k8s.io:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.pkg.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download inventory
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: inventory
          path: ${{ runner.temp }}/extract

      - name: Render preset
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/image-age.sh render --in "$RUNNER_TEMP/extract" --out "$RUNNER_TEMP/render"

      - name: Hash the preset and its data
        id: hashes
        run: .github/scripts/image-age.sh hashes --in "$RUNNER_TEMP/render" >>"$GITHUB_OUTPUT"

      - name: Upload preset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preset
          path: ${{ runner.temp }}/render
          retention-days: 1

  validate:
    name: "Validate preset"
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download preset
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preset
          path: ${{ runner.temp }}/render

      - name: Validate preset
        run: .github/scripts/image-age.sh validate --in "$RUNNER_TEMP/render"

  publish:
    name: "Publish preset"
    needs: [render, validate]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: plan-main
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download preset
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preset
          path: ${{ runner.temp }}/render

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: anthony-spruyt
          repositories: renovate-data
          permission-contents: write

      - name: Publish preset
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PRESET_SHA256: ${{ needs.render.outputs.preset-sha256 }}
          DATA_SHA256: ${{ needs.render.outputs.data-sha256 }}
        run: .github/scripts/image-age.sh publish --in "$RUNNER_TEMP/render"
