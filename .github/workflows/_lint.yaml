---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Lint

on:
  workflow_call:

permissions: {}

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-lint-${{ github.event_name == 'push' && github.sha || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      sarif: ${{ steps.sarif.outcome == 'success' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # The Go endpoints are for golangci-lint, registry.coder.com for trivy on spruyt-labs' Terraform
          allowed-endpoints: >-
            api.github.com:443
            check.trivy.dev:443
            ghcr.io:443
            github.com:443
            mirror.gcr.io:443
            pkg-containers.githubusercontent.com:443
            proxy.golang.org:443
            registry.coder.com:443
            results-receiver.actions.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            trivy.dev:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run MegaLinter
        env:
          # Changed-files-only hides breakage in file types absent from a diff
          VALIDATE_ALL_CODEBASE: true
          DISABLE_LINTERS: SPELL_LYCHEE
          ENABLE_DISABLE_LINTERS_PRIORITY: DISABLE
        run: ./lint.sh --ci

      - name: Save SARIF
        id: sarif
        if: >-
          (success() || failure())
          && hashFiles('megalinter-reports/megalinter-report.sarif') != ''
          && github.event.repository.visibility == 'public'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: megalinter-sarif
          path: megalinter-reports/megalinter-report.sarif
          retention-days: 1
          overwrite: true

  # The job id stays lint: it is part of the code scanning analysis key, so existing alerts carry over
  lint:
    name: Upload SARIF
    runs-on: ubuntu-latest
    needs: megalinter
    if: ${{ !cancelled() && needs.megalinter.outputs.sarif == 'true' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      # No checkout: PR code never reaches the job that holds security-events: write
      - name: Download SARIF
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: megalinter-sarif
          path: ${{ runner.temp }}/sarif

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/sarif/megalinter-report.sarif

  lychee:
    name: lychee
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-lychee-${{ github.event_name == 'push' && github.sha || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      # Audit, not block: link checks reach arbitrary hosts
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run lychee
        env:
          VALIDATE_ALL_CODEBASE: true
          ENABLE_LINTERS: SPELL_LYCHEE
        run: ./lint.sh --ci
