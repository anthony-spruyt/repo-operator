---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Build Image

on:
  workflow_call:
    inputs:
      language:
        description: Test suite to run before the build (go, python or none)
        required: false
        type: string
        default: none
      workdir:
        description: Project root for tests (go.mod or pyproject.toml lives here)
        required: false
        type: string
        default: "."
      image:
        description: Image name, also the GHCR package name. Defaults to the repository name
        required: false
        type: string
        default: ""
      context:
        description: Docker build context
        required: false
        type: string
        default: "."
      dockerfile:
        description: Dockerfile path. Defaults to <context>/Dockerfile
        required: false
        type: string
        default: ""
      push:
        description: Push the image and publish the release. Off for pull request checks
        required: false
        type: boolean
        default: false
      version:
        description: Version to publish, without a leading v. Required when push is true
        required: false
        type: string
        default: ""
      tag-name:
        description: Git tag of the release-please draft to build from and publish
        required: false
        type: string
        default: ""
      tag-prefix:
        description: Prefix for the docker version tags only ('' or 'v')
        required: false
        type: string
        default: ""
      dockerhub-namespace:
        description: Also push to docker.io/<namespace>/<image> (needs the DOCKERHUB_TOKEN secret)
        required: false
        type: string
        default: ""
      python-extras:
        description: Passed to _python-uv-test.yaml as extras
        required: false
        type: string
        default: ""
      python-test-paths:
        description: Passed to _python-uv-test.yaml as test-paths
        required: false
        type: string
        default: ""
      python-extra-commands:
        description: Passed to _python-uv-test.yaml as extra-commands
        required: false
        type: string
        default: ""
    secrets:
      DOCKERHUB_TOKEN:
        required: false
    outputs:
      digest:
        description: Image digest (empty unless push is true)
        value: ${{ jobs.build.outputs.digest }}

# No permissions block: jobs inherit the caller's, so pull request callers can grant contents: read only.

concurrency:
  group: build-${{ inputs.image || github.event.repository.name }}-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  test-go:
    name: Test
    if: inputs.language == 'go'
    uses: anthony-spruyt/repo-operator/.github/workflows/_go-test.yaml@shared-ci
    with:
      workdir: ${{ inputs.workdir }}
      ref: ${{ inputs.tag-name }}

  test-python:
    name: Test
    if: inputs.language == 'python'
    uses: anthony-spruyt/repo-operator/.github/workflows/_python-uv-test.yaml@shared-ci
    with:
      workdir: ${{ inputs.workdir }}
      ref: ${{ inputs.tag-name }}
      extras: ${{ inputs.python-extras }}
      test-paths: ${{ inputs.python-test-paths }}
      extra-commands: ${{ inputs.python-extra-commands }}

  build:
    name: ${{ inputs.push && 'Build and publish' || 'Build' }}
    needs:
      - test-go
      - test-python
    # At most one test job runs; a skipped need makes the implicit success() false.
    if: >-
      !cancelled()
      && (needs.test-go.result == 'success' || needs.test-go.result == 'skipped')
      && (needs.test-python.result == 'success' || needs.test-python.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Validate inputs
        env:
          LANGUAGE: ${{ inputs.language }}
          PUSH: ${{ inputs.push }}
          TAG_NAME: ${{ inputs.tag-name }}
        run: |
          case "$LANGUAGE" in
            go | python | none) ;;
            *) echo "::error::language must be go, python or none, got '$LANGUAGE'"; exit 1 ;;
          esac
          if [ "$PUSH" = "true" ] && [ -z "$TAG_NAME" ]; then
            echo "::error::tag-name is required when push is true"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag-name }}
          persist-credentials: false

      - name: Build image
        id: build
        uses: anthony-spruyt/repo-operator/.github/actions/build-image@shared-ci
        with:
          image: ${{ inputs.image || github.event.repository.name }}
          context: ${{ inputs.context }}
          dockerfile: ${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          version: ${{ inputs.version }}
          tag-prefix: ${{ inputs.tag-prefix }}
          go-mod: ${{ inputs.language == 'go' && format('{0}/go.mod', inputs.workdir) || '' }}
          dockerhub-namespace: ${{ inputs.dockerhub-namespace }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      # Must stay last: on failure the release stays a draft, so a published release always has an image.
      - name: Publish release
        if: inputs.push
        uses: anthony-spruyt/repo-operator/.github/actions/publish-release@shared-ci
        with:
          tag: ${{ inputs.tag-name }}
          image-ref: ${{ steps.build.outputs.image-ref }}
          digest: ${{ steps.build.outputs.digest }}
