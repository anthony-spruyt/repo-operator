---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Build Image

on:
  workflow_call:
    inputs:
      language:
        description: Test suite to run before the build (go, python, node or none)
        required: false
        type: string
        default: none
      workdir:
        description: Project root for tests (go.mod, pyproject.toml or package.json lives here)
        required: false
        type: string
        default: "."
      image:
        description: Image name, also the GHCR package name. Defaults to the repository name
        required: false
        type: string
        default: ""
      context:
        description: Docker build context
        required: false
        type: string
        default: "."
      dockerfile:
        description: Dockerfile path. Defaults to <context>/Dockerfile
        required: false
        type: string
        default: ""
      push:
        description: >-
          Push the image and publish the release-please draft for tag-name. The
          caller must run at the tagged commit, and must grant contents, packages,
          id-token and attestations write. Off for pull request checks
        required: false
        type: boolean
        default: false
      version:
        description: Version to publish, without a leading v. Required when push is true
        required: false
        type: string
        default: ""
      tag-name:
        description: Git tag of the release-please draft to publish. Must point at the commit being built
        required: false
        type: string
        default: ""
      tag-prefix:
        description: Prefix for the docker version tags only ('' or 'v')
        required: false
        type: string
        default: ""
      dockerhub-namespace:
        description: Also push to docker.io/<namespace>/<image> (needs the DOCKERHUB_TOKEN secret)
        required: false
        type: string
        default: ""
      dockerhub-username:
        description: Docker Hub login. Defaults to dockerhub-namespace
        required: false
        type: string
        default: ""
      test-command:
        description: Shell command run against the built image ($IMAGE_REF) before push; also runs on PR builds
        required: false
        type: string
        default: ""
      prepare-command:
        description: Shell command run from the repo root after checkout, before the build (e.g. to generate the Dockerfile)
        required: false
        type: string
        default: ""
      free-disk:
        description: Remove preinstalled runner toolchains first, for images that need more disk than the runner leaves free
        required: false
        type: boolean
        default: false
      extra-tags:
        description: Extra docker/metadata-action tag rules, one per line. Ignored when latest is false
        required: false
        type: string
        default: ""
      latest:
        description: >-
          Push and publish as the latest release. False pushes the version tag only and leaves the
          repo's latest-release marker alone, for a release a newer one has superseded
        required: false
        type: boolean
        default: true
      node-version:
        description: Node.js version for the node tests
        required: false
        type: string
        default: "24"
      python-version:
        description: Passed to _python-uv-test.yaml as python-version
        required: false
        type: string
        default: ""
      python-groups:
        description: Passed to _python-uv-test.yaml as groups
        required: false
        type: string
        default: ""
      python-extras:
        description: Passed to _python-uv-test.yaml as extras
        required: false
        type: string
        default: ""
      python-test-paths:
        description: Passed to _python-uv-test.yaml as test-paths
        required: false
        type: string
        default: ""
      python-extra-commands:
        description: Passed to _python-uv-test.yaml as extra-commands
        required: false
        type: string
        default: ""
      egress:
        description: Space-separated host:port endpoints this image's jobs reach besides the shared list (metadata.yaml egress)
        required: false
        type: string
        default: ""
    secrets:
      DOCKERHUB_TOKEN:
        required: false
    outputs:
      digest:
        description: Image digest (empty unless push is true)
        value: ${{ jobs.publish.outputs.digest }}

concurrency:
  group: build-${{ inputs.image || github.event.repository.name }}-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  test-go:
    name: Test
    if: inputs.language == 'go'
    uses: $/.github/workflows/_go-test.yaml
    with:
      workdir: ${{ inputs.workdir }}
      dockerfile: ${{ inputs.dockerfile || format('{0}/Dockerfile', inputs.context) }}
      egress: ${{ inputs.egress }}

  test-python:
    name: Test
    if: inputs.language == 'python'
    uses: $/.github/workflows/_python-uv-test.yaml
    with:
      workdir: ${{ inputs.workdir }}
      python-version: ${{ inputs.python-version }}
      groups: ${{ inputs.python-groups }}
      extras: ${{ inputs.python-extras }}
      test-paths: ${{ inputs.python-test-paths }}
      extra-commands: ${{ inputs.python-extra-commands }}
      egress: ${{ inputs.egress }}

  test-node:
    name: Test
    if: inputs.language == 'node'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: $/.github/actions/harden-runner
        with:
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            nodejs.org:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            ${{ inputs.egress }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        working-directory: ${{ inputs.workdir }}
        run: npm ci --ignore-scripts

      - name: Type check
        working-directory: ${{ inputs.workdir }}
        run: ./node_modules/.bin/tsc --noEmit

      - name: Run tests
        working-directory: ${{ inputs.workdir }}
        env:
          WORKDIR: ${{ inputs.workdir }}
        run: |
          if node -e 'process.exit(require("./package.json").scripts?.test ? 0 : 1)'; then
            npm test
          else
            echo "::notice::No test script in ${WORKDIR}/package.json, skipping tests"
          fi

  build:
    name: Build
    needs:
      - test-go
      - test-python
      - test-node
    # At most one test job runs; a skipped need makes the implicit success() false.
    if: >-
      !cancelled()
      && (needs.test-go.result == 'success' || needs.test-go.result == 'skipped')
      && (needs.test-python.result == 'success' || needs.test-python.result == 'skipped')
      && (needs.test-node.result == 'success' || needs.test-node.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: $/.github/actions/harden-runner
        with:
          allowed-endpoints: >-
            api.github.com:443
            auth.docker.io:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            ${{ inputs.egress }}

      - name: Validate inputs
        env:
          LANGUAGE: ${{ inputs.language }}
        run: |
          case "$LANGUAGE" in
            go | python | node | none) ;;
            *) echo "::error::language must be go, python, node or none, got '$LANGUAGE'"; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        if: inputs.free-disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          docker system prune -af
          df -h

      # publish gets only the prepared context, so a Dockerfile outside it would build unprepared
      - name: Check the Dockerfile is in the context
        if: inputs.prepare-command != ''
        env:
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          DOCKERFILE="${DOCKERFILE:-${CONTEXT%/}/Dockerfile}"
          case "$(realpath -m "$DOCKERFILE")" in
            "$(realpath -m "$CONTEXT")"/*) ;;
            *) echo "::error::With a prepare-command, the Dockerfile must be inside the context, got '$DOCKERFILE'"; exit 1 ;;
          esac

      - name: Prepare build
        if: inputs.prepare-command != ''
        env:
          PREPARE_COMMAND: ${{ inputs.prepare-command }}
        run: bash -euo pipefail -c "$PREPARE_COMMAND"

      # publish runs no repository commands, so it builds from what prepare left in the context
      - name: Pack prepared context
        if: inputs.push && inputs.prepare-command != ''
        env:
          CONTEXT: ${{ inputs.context }}
        run: tar -C "$CONTEXT" --exclude=./.git -cf "$RUNNER_TEMP/prepared-context.tar" .

      - name: Upload prepared context
        if: inputs.push && inputs.prepare-command != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prepared-context-${{ inputs.image || github.event.repository.name }}
          path: ${{ runner.temp }}/prepared-context.tar
          if-no-files-found: error
          retention-days: 7

      - name: Build image
        uses: $/.github/actions/build-image
        with:
          image: ${{ inputs.image || github.event.repository.name }}
          context: ${{ inputs.context }}
          dockerfile: ${{ inputs.dockerfile }}
          version: ${{ inputs.version }}
          tag-prefix: ${{ inputs.tag-prefix }}
          extra-tags: ${{ inputs.extra-tags }}
          go-mod: ${{ inputs.language == 'go' && format('{0}/go.mod', inputs.workdir) || '' }}
          dockerhub-namespace: ${{ inputs.dockerhub-namespace }}
          test-command: ${{ inputs.test-command }}

  publish:
    name: Build and publish
    needs:
      - test-go
      - test-python
      - test-node
      - build
    if: >-
      !cancelled() && inputs.push
      && (needs.test-go.result == 'success' || needs.test-go.result == 'skipped')
      && (needs.test-python.result == 'success' || needs.test-python.result == 'skipped')
      && (needs.test-node.result == 'success' || needs.test-node.result == 'skipped')
      && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: release
    # No permissions block on purpose: requesting write here fails read-only PR callers at startup, even though the job is skipped.
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Harden Runner
        uses: $/.github/actions/harden-runner
        with:
          allowed-endpoints: >-
            api.github.com:443
            auth.docker.io:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            results-receiver.actions.githubusercontent.com:443
            token.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            ${{ inputs.egress }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the tag is the commit being built
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LANGUAGE: ${{ inputs.language }}
          TAG_NAME: ${{ inputs.tag-name }}
          VERSION: ${{ inputs.version }}
        run: |
          case "$LANGUAGE" in
            go | python | node | none) ;;
            *) echo "::error::language must be go, python, node or none, got '$LANGUAGE'"; exit 1 ;;
          esac
          if [ -z "$TAG_NAME" ] || [ -z "$VERSION" ]; then
            echo "::error::tag-name and version are required when push is true"
            exit 1
          fi
          if ! DRAFT=$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft); then
            echo "::error::No release found for ${TAG_NAME}."
            exit 1
          fi
          case "$DRAFT" in
            true) ;;
            false)
              echo "::notice::Release ${TAG_NAME} is already published; skipping the build"
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "::error::Unexpected isDraft '${DRAFT}' for ${TAG_NAME}"
              exit 1
              ;;
          esac
          TAG_SHA=$(gh api "repos/${GH_REPO}/commits/refs/tags/${TAG_NAME}" --jq .sha)
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            echo "::error::Tag ${TAG_NAME} is ${TAG_SHA}, but this run started from ${HEAD_SHA}, so its provenance would name the wrong source. Re-running its failed jobs cannot publish ${TAG_NAME}, because a re-run builds the same commit. The next Release Please run rebuilds ${TAG_NAME} from its tag."
            exit 1
          fi

      - name: Free disk space
        if: steps.verify.outputs.published != 'true' && inputs.free-disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          docker system prune -af
          df -h

      - name: Download prepared context
        if: steps.verify.outputs.published != 'true' && inputs.prepare-command != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prepared-context-${{ inputs.image || github.event.repository.name }}
          path: ${{ runner.temp }}/prepared

      - name: Restore prepared context
        if: steps.verify.outputs.published != 'true' && inputs.prepare-command != ''
        env:
          CONTEXT: ${{ inputs.context }}
        run: |
          TARBALL="$RUNNER_TEMP/prepared/prepared-context.tar"
          LISTING=$(tar -tvf "$TARBALL")
          if grep -qv '^[-d]' <<<"$LISTING"; then
            echo "::error::The prepared context may hold only files and directories"
            exit 1
          fi
          if grep -qE '^/|(^|/)\.\.(/|$)' <<<"$(tar -tf "$TARBALL")"; then
            echo "::error::The prepared context holds a path outside it"
            exit 1
          fi
          tar -xf "$TARBALL" -C "$CONTEXT" --no-same-owner

      - name: Build and push image
        id: build
        if: steps.verify.outputs.published != 'true'
        uses: $/.github/actions/build-image
        with:
          image: ${{ inputs.image || github.event.repository.name }}
          context: ${{ inputs.context }}
          dockerfile: ${{ inputs.dockerfile }}
          push: "true"
          version: ${{ inputs.version }}
          tag-prefix: ${{ inputs.tag-prefix }}
          extra-tags: ${{ inputs.extra-tags }}
          latest: ${{ inputs.latest }}
          go-mod: ${{ inputs.language == 'go' && format('{0}/go.mod', inputs.workdir) || '' }}
          dockerhub-namespace: ${{ inputs.dockerhub-namespace }}
          dockerhub-username: ${{ inputs.dockerhub-username }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      # Must stay last: on failure the release stays a draft, so a published release always has an image.
      - name: Publish release
        if: steps.verify.outputs.published != 'true'
        uses: $/.github/actions/publish-release
        with:
          tag: ${{ inputs.tag-name }}
          image-ref: ${{ steps.build.outputs.image-ref }}
          digest: ${{ steps.build.outputs.digest }}
          latest: ${{ inputs.latest }}
