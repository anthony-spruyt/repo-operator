---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
# See https://github.com/anthony-spruyt/repo-operator/blob/main/src/templates/.github/workflows/ci.yaml for template comments
name: "CI"

on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
  workflow_dispatch: {}

permissions: {}

jobs:
  lint:
    if: "github.event_name != 'workflow_dispatch'"
    permissions:
      actions: "read"
      contents: "read"
      security-events: "write"
    uses: "./.github/workflows/_lint.yaml"

  xfg-plan:
    name: "XFG Plan"
    runs-on: "ubuntu-latest"
    needs:
      - "lint"
    # Skip commits made by the xfg GitHub App to prevent sync → commit → sync loops
    if: >-
      always() &&
      github.actor != 'repo-operator[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && needs.lint.result == 'success'))
    permissions:
      contents: "read"
    concurrency:
      group: "xfg-plan-${{ github.ref }}"
      cancel-in-progress: true
    outputs:
      run_sync: "${{ steps.changes.outputs.run_sync }}"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7
        with:
          fetch-depth: 0

      - name: "Check for src/ changes since last deploy"
        id: "changes"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::notice::Manual dispatch - forcing sync"
            echo "run_sync=true" >> "$GITHUB_OUTPUT"
          elif [ -z "${{ vars.LAST_XFG_DEPLOY_SHA }}" ]; then
            echo "::notice::No prior deploy recorded - forcing sync"
            echo "run_sync=true" >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "${{ vars.LAST_XFG_DEPLOY_SHA }}" 2>/dev/null; then
            echo "::notice::Prior deploy SHA not found in history - forcing sync"
            echo "run_sync=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "${{ vars.LAST_XFG_DEPLOY_SHA }}" HEAD -- src/; then
            echo "::notice::No changes in src/ since last deploy, skipping sync"
            echo "run_sync=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_sync=true" >> "$GITHUB_OUTPUT"
          fi

      # Read-only Plan App; the write-App fallback only lasts until the owner provisions PLAN_APP_* (#544)
      - name: "Plan Sync"
        if: "steps.changes.outputs.run_sync == 'true'"
        uses: "anthony-spruyt/xfg@19d6e51b90781b77d487a5450e6c0611dd0474fd" # v7.5.0
        with:
          config: "./src"
          dry-run: true
          github-client-id: "${{ vars.PLAN_APP_CLIENT_ID || vars.APP_CLIENT_ID }}"
          github-app-private-key: "${{ secrets.PLAN_APP_PRIVATE_KEY || secrets.APP_PRIVATE_KEY }}"

      - name: "Plan Secrets Sync"
        if: "steps.changes.outputs.run_sync == 'true'"
        uses: "anthony-spruyt/xfg@19d6e51b90781b77d487a5450e6c0611dd0474fd" # v7.5.0
        with:
          command: "secrets-sync"
          config: "./src"
          dry-run: true
          github-client-id: "${{ vars.PLAN_APP_CLIENT_ID || vars.APP_CLIENT_ID }}"
          github-app-private-key: "${{ secrets.PLAN_APP_PRIVATE_KEY || secrets.APP_PRIVATE_KEY }}"

      - name: "DIAG Plan App token"
        if: "github.event_name == 'pull_request'"
        id: "diag-token"
        uses: "actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1" # v3
        with:
          client-id: "${{ vars.PLAN_APP_CLIENT_ID }}"
          private-key: "${{ secrets.PLAN_APP_PRIVATE_KEY }}"
          owner: "anthony-spruyt"

      - name: "DIAG Plan App permissions"
        if: "github.event_name == 'pull_request'"
        env:
          CLIENT_ID: "${{ vars.PLAN_APP_CLIENT_ID }}"
          APP_KEY: "${{ secrets.PLAN_APP_PRIVATE_KEY }}"
          IAT: "${{ steps.diag-token.outputs.token }}"
        run: |
          set -euo pipefail
          echo "::add-mask::${IAT}"
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now=$(date +%s)
          header=$(printf '{"alg":"RS256","typ":"JWT"}' | b64)
          payload=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now - 60)) $((now + 540)) "$CLIENT_ID" | b64)
          keyfile=$(mktemp)
          printf '%s\n' "$APP_KEY" > "$keyfile"
          sig=$(printf '%s.%s' "$header" "$payload" | openssl dgst -sha256 -sign "$keyfile" | b64)
          rm -f "$keyfile"
          jwt="${header}.${payload}.${sig}"
          echo "::add-mask::${jwt}"
          api() { curl -fsS -H "Authorization: Bearer $1" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com$2"; }
          echo "== GET /app (app-level permissions)"
          api "$jwt" /app | jq '{slug, permissions}'
          echo "== GET /app/installations (granted permissions)"
          api "$jwt" /app/installations | jq '[.[] | {account: .account.login, repository_selection, permissions}]'
          for repo in claude-plugins container-images; do
            echo "== GET /repos/anthony-spruyt/${repo} with installation token (field presence only)"
            api "$IAT" "/repos/anthony-spruyt/${repo}" | jq '{token_repo_permissions: .permissions, allow_squash_merge: has("allow_squash_merge"), allow_merge_commit: has("allow_merge_commit"), allow_auto_merge: has("allow_auto_merge"), delete_branch_on_merge: has("delete_branch_on_merge"), allow_update_branch: has("allow_update_branch"), squash_merge_commit_title: has("squash_merge_commit_title"), security_and_analysis: has("security_and_analysis")}'
            for id in $(api "$IAT" "/repos/anthony-spruyt/${repo}/rulesets" | jq -r '.[].id'); do
              api "$IAT" "/repos/anthony-spruyt/${repo}/rulesets/${id}" | jq -c '{name, bypass_actors_present: has("bypass_actors"), current_user_can_bypass}'
            done
          done

  xfg-apply:
    name: "XFG Apply"
    runs-on: "ubuntu-latest"
    needs:
      - "xfg-plan"
    # !cancelled() breaks the transitive skip chain from lint → xfg-plan → xfg-apply
    if: >-
      !cancelled() &&
      needs.xfg-plan.result == 'success' &&
      needs.xfg-plan.outputs.run_sync == 'true' &&
      github.event_name != 'pull_request'
    environment: "production"
    permissions:
      actions: "read"
      contents: "write"
      pull-requests: "write"
      statuses: "write"
    concurrency:
      group: "xfg-apply"
      cancel-in-progress: false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7
        with:
          fetch-depth: 2

      - name: "Apply Sync"
        uses: "anthony-spruyt/xfg@19d6e51b90781b77d487a5450e6c0611dd0474fd" # v7.5.0
        env:
          OPENROUTER_API_KEY: "${{ secrets.OPENROUTER_API_KEY }}"
        with:
          config: "./src"
          github-client-id: "${{ vars.APP_CLIENT_ID }}"
          github-app-private-key: "${{ secrets.APP_PRIVATE_KEY }}"

      - name: "Apply Secrets Sync"
        uses: "anthony-spruyt/xfg@19d6e51b90781b77d487a5450e6c0611dd0474fd" # v7.5.0
        env:
          RELEASE_PLEASE_APP_CLIENT_ID: "${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}"
          RELEASE_PLEASE_APP_PRIVATE_KEY: "${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}"
          GHCR_READ_TOKEN: "${{ secrets.GHCR_READ_TOKEN }}"
          DOCKERHUB_TOKEN: "${{ secrets.DOCKERHUB_TOKEN }}"
        with:
          command: "secrets-sync"
          config: "./src"
          github-client-id: "${{ vars.APP_CLIENT_ID }}"
          github-app-private-key: "${{ secrets.APP_PRIVATE_KEY }}"

      - name: "Generate app token"
        id: "app-token"
        uses: "actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1" # v3
        with:
          client-id: "${{ vars.APP_CLIENT_ID }}"
          private-key: "${{ secrets.APP_PRIVATE_KEY }}"

      - name: "Record deploy SHA"
        env:
          GH_TOKEN: "${{ steps.app-token.outputs.token }}"
        run: gh variable set LAST_XFG_DEPLOY_SHA --body "${{ github.sha }}"

  # Summary job for branch protection - add jobs to 'needs' array
  summary:
    needs:
      - "lint"
      - "xfg-plan"
      - "xfg-apply"
    if: "always()"
    permissions:
      actions: "read"
      contents: "read"
    uses: "anthony-spruyt/repo-operator/.github/workflows/_summary.yaml@main"
