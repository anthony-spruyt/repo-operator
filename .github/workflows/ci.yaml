---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
# See https://github.com/anthony-spruyt/repo-operator/blob/main/src/templates/.github/workflows/ci.yaml for template comments
name: "CI"

on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
  workflow_dispatch: {}

permissions: {}

jobs:
  lint:
    if: "github.event_name != 'workflow_dispatch'"
    permissions:
      actions: "read"
      contents: "read"
      security-events: "write"
    uses: "./.github/workflows/_lint.yaml"

  # Repo-only jobs go in ci-repo.yaml; lint is skipped on dispatch, so they are too
  repo:
    needs:
      - "lint"
    permissions:
      contents: "read"
    uses: "./.github/workflows/ci-repo.yaml"
    secrets: "inherit"

  sonar:
    permissions: {}
    uses: "./.github/workflows/_sonar-new-issues.yaml"

  # PR code is untrusted, so it plans with the read-only Plan App. GitHub hides merge settings
  # and ruleset bypass_actors from read-only tokens, so this plan is a partial preview.
  xfg-preview:
    name: "XFG Plan (preview)"
    runs-on: "ubuntu-latest"
    needs:
      - "lint"
    if: >-
      always() &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'))
    permissions:
      contents: "read"
    concurrency:
      group: "xfg-preview-${{ github.ref }}"
      cancel-in-progress: true
    steps:
      # Same egress as XFG Plan, so a green preview proves Plan's allowlist on PRs
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            results-receiver.actions.githubusercontent.com:443

      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7
        with:
          persist-credentials: false

      - name: "Check xfg config"
        run: ".github/scripts/check-xfg-config.sh src"

      - name: "Preview notice"
        run: |
          {
            echo "> [!WARNING]"
            echo "> Preview from the read-only Plan App. Merge settings and ruleset \`bypass_actors\` are not visible to it and show as changes."
            echo "> Review the full plan in the XFG Plan job of the \`main\` run before approving XFG Apply."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Partial preview: merge settings and ruleset bypass_actors are not visible to the read-only Plan App"

      # The Plan App is not installed on every repo in src, so preview only the repos it can read
      - name: "Filter preview repos"
        run: |
          cp -r src "$RUNNER_TEMP/xfg-preview"
          yq -i 'del(.repos[] | select(.git == "https://github.com/anthony-spruyt/security.git"))' "$RUNNER_TEMP/xfg-preview/repos.yaml"

      - name: "Preview Sync"
        uses: "anthony-spruyt/xfg@11c1f30119d40e676211153f6d470a0dab56badc" # v8.5.0
        with:
          config: "${{ runner.temp }}/xfg-preview"
          dry-run: true
          github-client-id: "${{ vars.PLAN_APP_CLIENT_ID }}"
          github-app-private-key: "${{ secrets.PLAN_APP_PRIVATE_KEY }}"

      - name: "Preview Secrets Sync"
        uses: "anthony-spruyt/xfg@11c1f30119d40e676211153f6d470a0dab56badc" # v8.5.0
        with:
          command: "secrets-sync"
          config: "${{ runner.temp }}/xfg-preview"
          dry-run: true
          github-client-id: "${{ vars.PLAN_APP_CLIENT_ID }}"
          github-app-private-key: "${{ secrets.PLAN_APP_PRIVATE_KEY }}"

  # The plan the owner reads before approving Apply. It needs the write App's key to see every
  # field; plan-main's deployment branch rule (main only, no reviewer) keeps that key from PR refs.
  xfg-plan:
    name: "XFG Plan"
    runs-on: "ubuntu-latest"
    needs:
      - "lint"
    # Skip commits made by the xfg GitHub App to prevent sync → commit → sync loops
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      github.actor != 'repo-operator[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.lint.result == 'success'))
    environment: "plan-main"
    permissions:
      contents: "read"
    concurrency:
      group: "xfg-plan-${{ github.ref }}"
      cancel-in-progress: true
    outputs:
      run_sync: "${{ steps.changes.outputs.run_sync }}"
    steps:
      # Runs src/ the owner may not have reviewed, with the write key
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            results-receiver.actions.githubusercontent.com:443

      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Check xfg config"
        run: ".github/scripts/check-xfg-config.sh src"

      - name: "Check for src/ changes since last deploy"
        id: "changes"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::notice::Manual dispatch - forcing sync"
            echo "run_sync=true" >> "$GITHUB_OUTPUT"
          elif [ -z "${{ vars.LAST_XFG_DEPLOY_SHA }}" ]; then
            echo "::notice::No prior deploy recorded - forcing sync"
            echo "run_sync=true" >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "${{ vars.LAST_XFG_DEPLOY_SHA }}" 2>/dev/null; then
            echo "::notice::Prior deploy SHA not found in history - forcing sync"
            echo "run_sync=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "${{ vars.LAST_XFG_DEPLOY_SHA }}" HEAD -- src/; then
            echo "::notice::No changes in src/ since last deploy, skipping sync"
            echo "run_sync=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_sync=true" >> "$GITHUB_OUTPUT"
          fi

      # A partial plan is the risk this job exists to remove, so never fall back to the Plan App
      - name: "Require plan-main credentials"
        if: "steps.changes.outputs.run_sync == 'true'"
        env:
          HAS_CLIENT_ID: "${{ vars.APP_CLIENT_ID != '' }}"
          HAS_KEY: "${{ secrets.APP_PRIVATE_KEY != '' }}"
        run: |
          if [ "$HAS_CLIENT_ID" != "true" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::error::APP_CLIENT_ID or APP_PRIVATE_KEY is missing from the plan-main environment; refusing to produce a partial plan"
            exit 1
          fi

      - name: "Plan Sync"
        if: "steps.changes.outputs.run_sync == 'true'"
        uses: "anthony-spruyt/xfg@11c1f30119d40e676211153f6d470a0dab56badc" # v8.5.0
        with:
          config: "./src"
          dry-run: true
          github-client-id: "${{ vars.APP_CLIENT_ID }}"
          github-app-private-key: "${{ secrets.APP_PRIVATE_KEY }}"

      - name: "Plan Secrets Sync"
        if: "steps.changes.outputs.run_sync == 'true'"
        uses: "anthony-spruyt/xfg@11c1f30119d40e676211153f6d470a0dab56badc" # v8.5.0
        with:
          command: "secrets-sync"
          config: "./src"
          dry-run: true
          github-client-id: "${{ vars.APP_CLIENT_ID }}"
          github-app-private-key: "${{ secrets.APP_PRIVATE_KEY }}"

  xfg-apply:
    name: "XFG Apply"
    runs-on: "ubuntu-latest"
    needs:
      - "xfg-plan"
    # !cancelled() breaks the transitive skip chain from lint → xfg-plan → xfg-apply
    if: >-
      !cancelled() &&
      needs.xfg-plan.result == 'success' &&
      needs.xfg-plan.outputs.run_sync == 'true' &&
      github.event_name != 'pull_request'
    environment: "production"
    permissions:
      actions: "read"
      contents: "write"
      pull-requests: "write"
      statuses: "write"
    concurrency:
      group: "xfg-apply"
      cancel-in-progress: false
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            openrouter.ai:443
            registry.npmjs.org:443
            results-receiver.actions.githubusercontent.com:443

      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: "Check xfg config"
        run: ".github/scripts/check-xfg-config.sh src"

      - name: "Apply Sync"
        uses: "anthony-spruyt/xfg@11c1f30119d40e676211153f6d470a0dab56badc" # v8.5.0
        env:
          OPENROUTER_API_KEY: "${{ secrets.OPENROUTER_API_KEY }}"
        with:
          config: "./src"
          github-client-id: "${{ vars.APP_CLIENT_ID }}"
          github-app-private-key: "${{ secrets.APP_PRIVATE_KEY }}"

      - name: "Apply Secrets Sync"
        uses: "anthony-spruyt/xfg@11c1f30119d40e676211153f6d470a0dab56badc" # v8.5.0
        env:
          RELEASE_PLEASE_APP_CLIENT_ID: "${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}"
          RELEASE_PLEASE_APP_PRIVATE_KEY: "${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}"
          GHCR_READ_TOKEN: "${{ secrets.GHCR_READ_TOKEN }}"
          DOCKERHUB_TOKEN: "${{ secrets.DOCKERHUB_TOKEN }}"
        with:
          command: "secrets-sync"
          config: "./src"
          github-client-id: "${{ vars.APP_CLIENT_ID }}"
          github-app-private-key: "${{ secrets.APP_PRIVATE_KEY }}"

      - name: "Generate app token"
        id: "app-token"
        uses: "actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1" # v3
        with:
          client-id: "${{ vars.APP_CLIENT_ID }}"
          private-key: "${{ secrets.APP_PRIVATE_KEY }}"

      - name: "Record deploy SHA"
        env:
          GH_TOKEN: "${{ steps.app-token.outputs.token }}"
        run: gh variable set LAST_XFG_DEPLOY_SHA --body "${{ github.sha }}"

  # The one required check from CI: it judges every job in the run, the repo / ... jobs included
  summary:
    needs:
      - "lint"
      - "repo"
      - "xfg-preview"
      - "xfg-plan"
      - "xfg-apply"
      - "sonar"
    if: "always()"
    permissions:
      actions: "read"
      contents: "read"
    uses: "./.github/workflows/_summary.yaml"
