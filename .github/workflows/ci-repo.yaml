---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: "CI (repo)"

on:
  workflow_call: {}

permissions: {}

jobs:
  guard-test:
    name: "Guard Tests"
    runs-on: "ubuntu-latest"
    timeout-minutes: 10
    permissions:
      contents: "read"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          # The apt hosts are for bats
          allowed-endpoints: >-
            azure.archive.ubuntu.com:80
            github.com:443
            packages.microsoft.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443

      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Install bats"
        run: "sudo apt-get update -qq && sudo apt-get install -y -qq bats"

      - name: "Install actionlint"
        env:
          # renovate: depName=rhysd/actionlint datasource=github-release-attachments digest=sha256
          ACTIONLINT_VERSION: "v1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO --proto '=https' "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/$tarball"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          sudo tar -xzf "$tarball" -C /usr/local/bin actionlint

      - name: "Install jsonata"
        env:
          # renovate: depName=jsonata datasource=npm
          JSONATA_VERSION: "2.2.2"
        run: |
          prefix="$RUNNER_TEMP/jsonata"
          mkdir -p "$prefix"
          npm install --no-save --ignore-scripts --prefix "$prefix" jsonata@"$JSONATA_VERSION"
          echo "NODE_PATH=$prefix/node_modules" >>"$GITHUB_ENV"

      - name: "Run bats tests"
        run: "bats -r test/"
