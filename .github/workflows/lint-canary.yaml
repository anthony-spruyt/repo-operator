---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Lint Canary

on:
  workflow_call:

permissions:
  contents: read

env:
  LINT_FILES: >-
    [".devcontainer/Dockerfile", ".editorconfig", ".golangci.yml", ".markdownlint.json", ".mega-linter-base.yml",
    ".mega-linter.yml", ".pre-commit-config.yaml", ".pylintrc", ".yamllint.yml", "lint.sh", "ruff-base.toml",
    "trivy-mega-linter.yaml"]

jobs:
  render:
    name: Render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      repos: ${{ steps.affected.outputs.repos || '[]' }}
      devcontainer-image: ${{ steps.image.outputs.image }}
    steps:
      - name: Harden Runner
        uses: $/.github/actions/harden-runner
        with:
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Decide
        id: needed
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "run=$(git diff --name-only HEAD^1 HEAD | .github/scripts/lint-canary-needed.sh)" >> "$GITHUB_OUTPUT"

      - name: Render planned files
        if: steps.needed.outputs.run == 'true'
        uses: anthony-spruyt/xfg@c6be9be2324eeeb375559f03cc36ebf0168ce513 # v8.6.0
        with:
          config: ./src
          dry-run: true
          render-dir: ${{ runner.temp }}/render
          github-client-id: ${{ vars.PLAN_APP_CLIENT_ID }}
          github-app-private-key: ${{ secrets.PLAN_APP_PRIVATE_KEY }}

      - name: Find repos whose lint files change
        if: steps.needed.outputs.run == 'true'
        id: affected
        env:
          RENDER: ${{ runner.temp }}/render
        run: |
          repos=$(jq -c --argjson lint "$LINT_FILES" '
            [.repos | to_entries[]
              | select(.value.files + .value.deleted | any(. as $f | $lint | index($f)))
              | {full: .key, name: (.key | split("/")[1])}]
          ' "$RENDER/render.json")
          echo "repos=$repos" >> "$GITHUB_OUTPUT"
          {
            echo "### Repos whose lint files change"
            jq -r 'if length == 0 then "None: nothing to lint." else .[] | "- \(.full)" end' <<< "$repos"
          } >> "$GITHUB_STEP_SUMMARY"
          # Artifacts drop file modes, so ship the render as a tarball
          tar -C "$RENDER" -czf "$RUNNER_TEMP/render.tgz" .

      - name: Name the devcontainer image
        if: steps.needed.outputs.run == 'true'
        id: image
        run: |
          image=$(.github/scripts/devcontainer-image.sh src/templates/.devcontainer/Dockerfile)
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Upload render
        if: steps.needed.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: render
          path: ${{ runner.temp }}/render.tgz
          retention-days: 1

  lint:
    name: Lint ${{ matrix.repo.name }}
    needs: render
    if: needs.render.outputs.repos != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.render.outputs.repos) }}
    steps:
      - name: Harden Runner
        uses: $/.github/actions/harden-runner
        with:
          # The MegaLinter job's allowlist in _lint.yaml, which lychee is kept out of for the same reason, plus Docker Hub and the hook installs of pre-commit
          allowed-endpoints: >-
            api.github.com:443
            auth.docker.io:443
            check.trivy.dev:443
            dl.google.com:443
            files.pythonhosted.org:443
            ghcr.io:443
            github.com:443
            go.dev:443
            mirror.gcr.io:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            proxy.golang.org:443
            pypi.org:443
            registry-1.docker.io:443
            registry.coder.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            trivy.dev:443
            *.blob.core.windows.net:443

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PLAN_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLAN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repo.name }}
          permission-contents: read

      - name: Checkout ${{ matrix.repo.full }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo.full }}
          token: ${{ steps.app-token.outputs.token }}
          path: target
          persist-credentials: false

      - name: Download render
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: render
          path: ${{ runner.temp }}

      - name: Overlay planned files
        env:
          REPO: ${{ matrix.repo.full }}
        run: |
          mkdir "$RUNNER_TEMP/render"
          tar -C "$RUNNER_TEMP/render" -xzf "$RUNNER_TEMP/render.tgz"
          if [ -d "$RUNNER_TEMP/render/$REPO" ]; then
            cp -r "$RUNNER_TEMP/render/$REPO/." target/
          fi
          jq -r --arg repo "$REPO" '.repos[$repo].deleted[]' "$RUNNER_TEMP/render/render.json" |
            while IFS= read -r file; do
              rm -f -- "target/$file"
            done
          git -C target add -A
          git -C target status --short

      - name: Cache pre-commit hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('target/.pre-commit-config.yaml') }}-${{ needs.render.outputs.devcontainer-image }}

      - name: Run MegaLinter
        working-directory: target
        env:
          VALIDATE_ALL_CODEBASE: true
          DISABLE_LINTERS: SPELL_LYCHEE
          ENABLE_DISABLE_LINTERS_PRIORITY: DISABLE
        run: ./lint.sh --ci

      - name: Run pre-commit
        if: ${{ !cancelled() }}
        working-directory: target
        env:
          DEVCONTAINER_IMAGE: ${{ needs.render.outputs.devcontainer-image }}
        run: |
          mkdir -p "$HOME/.cache/pre-commit"
          docker run --rm -u "$(id -u):$(id -g)" \
            -e HOME=/tmp -e PRE_COMMIT_HOME=/cache \
            -e SKIP=gitleaks,xfg-managed,terraform_fmt,terraform_tflint \
            -v "$HOME/.cache/pre-commit:/cache" -v "$PWD:/w" -w /w \
            "$DEVCONTAINER_IMAGE" pre-commit run --all-files --show-diff-on-failure
