---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: CI Summary

on:
  workflow_call:

permissions:
  actions: read
  contents: read

jobs:
  summary:
    name: Check Results
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            results-receiver.actions.githubusercontent.com:443

      - name: Check job results
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # --jq runs once per page, so emit one job per line and slurp them into one list
          job_lines=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.name != "summary / Check Results") | {name: .name, conclusion: .conclusion}')
          jobs_json=$(jq -s . <<<"$job_lines")

          {
            echo "## CI Results"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "$jobs_json" | jq -r '.[] | "\(.name)|\(.conclusion)"' | while IFS='|' read -r name conclusion; do
            case "$conclusion" in
              success)   icon="✅" ;;
              failure)   icon="❌" ;;
              cancelled) icon="⚪" ;;
              skipped)   icon="⏭️" ;;
              *)         icon="❓" ;;
            esac
            echo "| $name | $icon ${conclusion:-pending} |" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"

          if echo "$jobs_json" | jq -e '.[] | select(.conclusion == "failure" or .conclusion == "cancelled")' > /dev/null 2>&1; then
            echo "::error::One or more jobs failed or were cancelled"
            exit 1
          fi

          echo "::notice::All jobs passed"
