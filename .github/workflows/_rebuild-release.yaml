---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Rebuild Release

on:
  workflow_call:
    inputs:
      version:
        description: Version to rebuild, without a leading v (e.g. 1.2.3)
        required: true
        type: string
      image:
        description: >-
          Image name for a package at the repo root. Defaults to the lowercased
          repository name. The image to rebuild is the caller's workflow_dispatch
          image input, which may be empty when the repo has one image
        required: false
        type: string
        default: ""
      language:
        description: Passed to _build-image.yaml when the image's metadata.yaml sets no language
        required: false
        type: string
        default: none
      dockerhub-namespace:
        description: Passed to _build-image.yaml
        required: false
        type: string
        default: ""
      dockerhub-username:
        description: Passed to _build-image.yaml
        required: false
        type: string
        default: ""
      test-command:
        description: Passed to _build-image.yaml when the image's metadata.yaml sets no test-command
        required: false
        type: string
        default: ""
      python-version:
        description: Passed to _build-image.yaml
        required: false
        type: string
        default: ""
      python-groups:
        description: Passed to _build-image.yaml
        required: false
        type: string
        default: ""
      python-extras:
        description: Passed to _build-image.yaml
        required: false
        type: string
        default: ""
      python-test-paths:
        description: Passed to _build-image.yaml
        required: false
        type: string
        default: ""
      python-extra-commands:
        description: Passed to _build-image.yaml
        required: false
        type: string
        default: ""
    secrets:
      DOCKERHUB_TOKEN:
        required: false

concurrency:
  group: rebuild-${{ github.event.inputs.image }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Draft releases are invisible to a read-only token.
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect the image and its tag
        id: detect
        uses: $/.github/actions/detect-images
        with:
          mode: rebuild
          image: ${{ github.event.inputs.image }}
          version: ${{ inputs.version }}
          root-name: ${{ inputs.image }}

      - name: Verify the release is recoverable
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX: ${{ steps.detect.outputs.matrix }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG=$(jq -r '.include[0]."tag-name"' <<<"$MATRIX")
          IMAGE=$(jq -r '.include[0].name' <<<"$MATRIX")
          PREFIX="${TAG%"$VERSION"}"
          if ! git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null; then
            echo "::error::Tag ${TAG} does not exist. This workflow rebuilds an existing release; it does not create one."
            exit 1
          fi

          # The image job builds the checked-out ref, so the run itself must start from the tag.
          if [ "$GITHUB_REF" != "refs/tags/${TAG}" ]; then
            echo "::error::Run this workflow from the tag, not ${GITHUB_REF}: gh workflow run rebuild-release.yaml --ref ${TAG} -f image=${IMAGE} -f version=${VERSION}"
            exit 1
          fi

          if ! DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            echo "::error::No release found for ${TAG}."
            exit 1
          fi

          if [ "$DRAFT" != "true" ]; then
            echo "::error::Release ${TAG} is already published. Cut a new version instead."
            exit 1
          fi

          # The digit after the prefix keeps llm-guard from matching llm-guard-cuda tags.
          NEWEST=$(gh release list --limit 200 --json tagName,isDraft \
            --jq '.[] | select(.isDraft == false) | .tagName' \
            | while IFS= read -r t; do
                case "$t" in "$PREFIX"[0-9]*) echo "${t#"$PREFIX"}" ;; esac
              done | sort -V | tail -n 1)

          if [ -n "$NEWEST" ] && [ "$(printf '%s\n%s\n' "$NEWEST" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            echo "::error::${IMAGE} ${NEWEST} is already published, so rebuilding ${VERSION} would move the latest and major.minor tags backwards. Cut a new version instead."
            exit 1
          fi

  build:
    name: ${{ matrix.name }}
    needs: resolve
    strategy:
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    uses: $/.github/workflows/_build-image.yaml
    with:
      language: ${{ matrix.language || inputs.language }}
      workdir: ${{ matrix.workdir }}
      image: ${{ matrix.name }}
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.dockerfile }}
      prepare-command: ${{ matrix.prepare-command }}
      free-disk: ${{ matrix.free-disk }}
      extra-tags: ${{ matrix.extra-tags }}
      push: true
      version: ${{ matrix.version }}
      tag-name: ${{ matrix.tag-name }}
      tag-prefix: ${{ matrix.tag-prefix }}
      dockerhub-namespace: ${{ inputs.dockerhub-namespace }}
      dockerhub-username: ${{ inputs.dockerhub-username }}
      test-command: ${{ matrix.test-command || inputs.test-command }}
      python-version: ${{ inputs.python-version }}
      python-groups: ${{ inputs.python-groups }}
      python-extras: ${{ inputs.python-extras }}
      python-test-paths: ${{ inputs.python-test-paths }}
      python-extra-commands: ${{ inputs.python-extra-commands }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
