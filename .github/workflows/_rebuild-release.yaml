---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Rebuild Release

on:
  workflow_call:
    inputs:
      version:
        description: Version to rebuild, without a leading v (e.g. 1.2.3)
        required: true
        type: string
      config-file:
        description: release-please config, read to derive the git tag of the root (".") package
        required: false
        type: string
        default: release-please-config.json
      language:
        description: Passed to _build-image.yaml
        required: false
        type: string
        default: none
      workdir:
        description: Passed to _build-image.yaml
        required: false
        type: string
        default: "."
      image:
        description: Passed to _build-image.yaml
        required: false
        type: string
        default: ""
      context:
        description: Passed to _build-image.yaml
        required: false
        type: string
        default: "."
      dockerfile:
        description: Passed to _build-image.yaml
        required: false
        type: string
        default: ""
      tag-prefix:
        description: Passed to _build-image.yaml
        required: false
        type: string
        default: ""
      dockerhub-namespace:
        description: Passed to _build-image.yaml
        required: false
        type: string
        default: ""
      python-extras:
        description: Passed to _build-image.yaml
        required: false
        type: string
        default: ""
      python-test-paths:
        description: Passed to _build-image.yaml
        required: false
        type: string
        default: ""
      python-extra-commands:
        description: Passed to _build-image.yaml
        required: false
        type: string
        default: ""
    secrets:
      DOCKERHUB_TOKEN:
        required: false

concurrency:
  group: rebuild-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve
    runs-on: ubuntu-latest
    # Draft releases are invisible to a read-only token.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Derive tag
        id: tag
        env:
          CONFIG: ${{ inputs.config-file }}
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid version: $VERSION (no leading v)"
            exit 1
          fi
          # Mirrors release-please's TagName defaults: component-in-tag true, v-in-tag true, separator "-".
          PREFIX=$(jq -er '
            . as $c | .packages["."] as $p
            | if $p == null then error("no root (\".\") package") else . end
            | def opt($k; $d): if $p | has($k) then $p[$k] elif $c | has($k) then $c[$k] else $d end;
            ($p.component // $p["package-name"] // $c.component // $c["package-name"] // "") as $component
            | opt("include-component-in-tag"; true) as $withComponent
            | opt("include-v-in-tag"; true) as $withV
            | ($p["tag-separator"] // $c["tag-separator"] // "-") as $sep
            | (if $component != "" and $withComponent then $component + $sep else "" end)
              + (if $withV then "v" else "" end)
          ' "$CONFIG")
          {
            echo "prefix=$PREFIX"
            echo "tag=${PREFIX}${VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify the release is recoverable
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PREFIX: ${{ steps.tag.outputs.prefix }}
          VERSION: ${{ inputs.version }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null; then
            echo "::error::Tag ${TAG} does not exist. This workflow rebuilds an existing release; it does not create one."
            exit 1
          fi

          # The image job builds the checked-out ref, so the run itself must start from the tag.
          if [ "$GITHUB_REF" != "refs/tags/${TAG}" ]; then
            echo "::error::Run this workflow from the tag, not ${GITHUB_REF}: gh workflow run rebuild-release.yaml --ref ${TAG} -f version=${VERSION}"
            exit 1
          fi

          if ! DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            echo "::error::No release found for ${TAG}."
            exit 1
          fi

          if [ "$DRAFT" != "true" ]; then
            echo "::error::Release ${TAG} is already published. Cut a new version instead."
            exit 1
          fi

          NEWEST=$(gh release list --limit 200 --json tagName,isDraft \
            --jq '.[] | select(.isDraft == false) | .tagName' \
            | while IFS= read -r t; do
                case "$t" in "$PREFIX"[0-9]*) echo "${t#"$PREFIX"}" ;; esac
              done | sort -V | tail -n 1)

          if [ -n "$NEWEST" ] && [ "$(printf '%s\n%s\n' "$NEWEST" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            echo "::error::${NEWEST} is already published, so rebuilding ${VERSION} would move the latest and major.minor tags backwards. Cut a new version instead."
            exit 1
          fi

  build:
    name: Image
    needs: resolve
    uses: $/.github/workflows/_build-image.yaml
    with:
      language: ${{ inputs.language }}
      workdir: ${{ inputs.workdir }}
      image: ${{ inputs.image }}
      context: ${{ inputs.context }}
      dockerfile: ${{ inputs.dockerfile }}
      push: true
      version: ${{ inputs.version }}
      tag-name: ${{ needs.resolve.outputs.tag }}
      tag-prefix: ${{ inputs.tag-prefix }}
      dockerhub-namespace: ${{ inputs.dockerhub-namespace }}
      python-extras: ${{ inputs.python-extras }}
      python-test-paths: ${{ inputs.python-test-paths }}
      python-extra-commands: ${{ inputs.python-extra-commands }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
