---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Images

on:
  workflow_call:
    inputs:
      language:
        description: Passed to _build-image.yaml for images whose metadata.yaml sets no language
        required: false
        type: string
        default: none
      image:
        description: Image name for a package at the repo root. Defaults to the lowercased repository name
        required: false
        type: string
        default: ""
      test-command:
        description: Passed to _build-image.yaml for images whose metadata.yaml sets no test-command
        required: false
        type: string
        default: ""
      dockerhub-namespace:
        description: Passed to _build-image.yaml for every image
        required: false
        type: string
        default: ""
      dockerhub-username:
        description: Passed to _build-image.yaml for every image
        required: false
        type: string
        default: ""
      python-version:
        description: Passed to _build-image.yaml for every image
        required: false
        type: string
        default: ""
      python-groups:
        description: Passed to _build-image.yaml for every image
        required: false
        type: string
        default: ""
      python-extras:
        description: Passed to _build-image.yaml for every image
        required: false
        type: string
        default: ""
      python-test-paths:
        description: Passed to _build-image.yaml for every image
        required: false
        type: string
        default: ""
      python-extra-commands:
        description: Passed to _build-image.yaml for every image
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  detect:
    name: Detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has-images: ${{ steps.detect.outputs.has-images }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      # Strings, not numbers: 0 is falsy in expressions, so a numeric && 0 || 2 would always be 2
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '2' }}
          persist-credentials: false

      - name: Detect images
        id: detect
        uses: $/.github/actions/detect-images
        with:
          mode: ${{ github.event_name == 'workflow_dispatch' && 'all' || 'changed' }}
          image: ${{ github.event.inputs.image }}
          root-name: ${{ inputs.image }}

  build:
    name: ${{ matrix.name }}
    needs: detect
    if: needs.detect.outputs.has-images == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    uses: $/.github/workflows/_build-image.yaml
    with:
      language: ${{ matrix.language || inputs.language }}
      workdir: ${{ matrix.workdir }}
      image: ${{ matrix.name }}
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.dockerfile }}
      prepare-command: ${{ matrix.prepare-command }}
      free-disk: ${{ matrix.free-disk }}
      extra-tags: ${{ matrix.extra-tags }}
      test-command: ${{ matrix.test-command || inputs.test-command }}
      dockerhub-namespace: ${{ inputs.dockerhub-namespace }}
      dockerhub-username: ${{ inputs.dockerhub-username }}
      python-version: ${{ inputs.python-version }}
      python-groups: ${{ inputs.python-groups }}
      python-extras: ${{ inputs.python-extras }}
      python-test-paths: ${{ inputs.python-test-paths }}
      python-extra-commands: ${{ inputs.python-extra-commands }}
