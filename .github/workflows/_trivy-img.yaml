---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Trivy Container Image Scan

on:
  workflow_call:
    secrets:
      # Optional so callers synced before the secret existed still parse; the step fails loudly instead.
      GHCR_READ_TOKEN:
        required: false

permissions:
  contents: read
  packages: read
  security-events: write

env:
  REGISTRY: ghcr.io

jobs:
  discover-images:
    name: Discover Images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.discover.outputs.images }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d
        with:
          egress-policy: audit

      # The list endpoint rejects GITHUB_TOKEN and app tokens (HTTP 400), so this
      # needs a classic PAT with only read:packages. See repo-operator#390 step 5.
      - name: List this repo's images from GHCR
        id: discover
        env:
          GH_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GHCR_READ_TOKEN is not set. repo-operator syncs it to github-trivy repos."
            exit 1
          fi

          REPO="${GITHUB_REPOSITORY#*/}"
          IMAGES=$(gh api --paginate \
            "users/${GITHUB_REPOSITORY_OWNER}/packages?package_type=container&per_page=100" \
            --jq ".[] | select(.repository.name == \"$REPO\") | .name" | jq -Rsc 'split("\n") | map(select(. != "")) | sort')

          COUNT=$(echo "$IMAGES" | jq 'length')
          echo "Found $COUNT images linked to $REPO"
          echo "$IMAGES" | jq .

          echo "images=$IMAGES" >> "$GITHUB_OUTPUT"

  scan-images:
    name: Scan ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: discover-images
    if: needs.discover-images.outputs.images != '[]'
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.discover-images.outputs.images) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image exists
        id: check-image
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          IMAGE_REF="${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/${IMAGE}:latest"
          if docker manifest inspect "$IMAGE_REF" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image exists: $IMAGE_REF"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Image not found: $IMAGE_REF"
          fi

      - name: Detect Trivy ignore file
        id: trivyconfig
        if: steps.check-image.outputs.exists == 'true'
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          if [ -f "${IMAGE}/.trivyignore" ]; then
            echo "ignorefile=${IMAGE}/.trivyignore" >> "$GITHUB_OUTPUT"
            echo "Using per-image ignore: ${IMAGE}/.trivyignore"
          elif [ -f ".trivyignore.yaml" ]; then
            echo "ignorefile=.trivyignore.yaml" >> "$GITHUB_OUTPUT"
            echo "Using repo-level ignore: .trivyignore.yaml"
          else
            echo "ignorefile=" >> "$GITHUB_OUTPUT"
            echo "No ignore file found"
          fi

      - name: Trivy scan
        if: steps.check-image.outputs.exists == 'true'
        uses: anthony-spruyt/repo-operator/.github/actions/trivy-scan@main
        with:
          scan-type: image
          scanners: misconfig,secret,vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          trivyignores: ${{ steps.trivyconfig.outputs.ignorefile }}
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest
          image-name: ${{ matrix.image }}
          category: trivy-daily-${{ matrix.image }}
